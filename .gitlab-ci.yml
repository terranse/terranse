---
stages:
  - check

# Nothing here deploys: the HTPC is built, signed and published by nixhost
# (nix/roles/update-host.nix), and `just deploy htpc` runs that same job.
variables:
  GIT_DEPTH: "0"

.nix:
  image: nixos/nix:latest
  tags:
    - nix
  before_script:
    - |
      set -eu
      printf 'experimental-features = nix-command flakes\n' >> /etc/nix/nix.conf
      mkdir -p ~/.ssh && chmod 700 ~/.ssh
      # `:?`, not a bare "$VAR". An unset or misnamed CI variable otherwise
      # writes a zero-byte key file and the job carries on, failing much
      # later and somewhere else entirely -- inside a git+ssh flake fetch,
      # with an error that names neither the variable nor the reason. Fail
      # here, where the message can say which variable to set and where.
      : "${DEPLOY_SSH_KEY:?unset or empty -- set it (base64 of the deploy private key) under Settings, CI/CD, Variables}"
      : "${KNOWN_HOSTS:?unset or empty -- set it (ssh-keyscan output) under Settings, CI/CD, Variables}"
      # umask, not a chmod afterwards: a default-umask create leaves the
      # private key world-readable for the window between the two commands,
      # and this runner is shared with every other job in the group.
      # base64 because a masked CI variable cannot hold a multi-line PEM.
      (umask 077; printf '%s' "$DEPLOY_SSH_KEY" | base64 -d > ~/.ssh/id_ed25519)
      # Without known_hosts the git+ssh flake input and the closure push both
      # hang on host-key confirmation in a container with no TTY.
      (umask 077; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts)

flake-check:
  extends: .nix
  stage: check
  script:
    # Eval-only, and ahead of the loop below: this is what still gives
    # nixosConfigurations.installer and every <machine>-lxc-template
    # package eval coverage. Neither is in checks.x86_64-linux -- the
    # installer ISO is 1.4 GB and CI should not build one on every push --
    # so without this line an eval error in either would reach the default
    # branch uncaught, the exact coverage `nix flake check -L` used to give
    # for free before this job started building checks individually.
    - nix flake check --no-build -L
    # Enumerated, not hardcoded: a name list here is a maintenance trap --
    # every machine added to nix/machines.nix after this list was last
    # edited would silently stop being built in CI, with nothing to say so.
    # The one exception is staged-updates, which needs /dev/kvm the
    # runner's LXC does not expose today -- skipped loudly, not silently,
    # rather than hardcoded around.
    - |
      set -euo pipefail
      # nix, not jq -- nixos/nix:latest ships nix, bash, and coreutils, but
      # no jq, so a `| jq -r '.[]'` here would exit 127 on every real
      # pipeline run. `builtins.concatStringsSep "\n"` does jq's job with
      # nothing beyond the tool already required to build anything below.
      checks=$(nix eval --raw .#checks.x86_64-linux \
        --apply 'cs: builtins.concatStringsSep "\n" (builtins.attrNames cs)')
      # An empty set must fail loudly, not silently build nothing and exit
      # 0 -- that is the identical failure class this enumeration exists to
      # fix in the first place. A loop over nothing can't say so from
      # inside itself, so this has to be checked before the loop.
      if [ -z "$checks" ]; then
        echo "no checks enumerated from .#checks.x86_64-linux; refusing to silently build nothing" >&2
        exit 1
      fi
      # while+read over a here-string, not `for c in $checks` -- unquoted
      # word-splitting on $checks would glob and mis-split on any check
      # name containing a space or shell metacharacter. Current names are
      # safe; the parsing itself should not depend on that staying true. A
      # here-string keeps the loop in this shell rather than a subshell (a
      # pipe into `while` would fork one), so `set -e` above still fails
      # the whole job if a build inside the loop fails.
      while IFS= read -r c; do
        if [ "$c" = "staged-updates" ] && [ ! -e /dev/kvm ]; then
          echo "no /dev/kvm on this runner; skipping the staged-updates VM test"
          continue
        fi
        echo "building check: $c"
        nix build -L ".#checks.x86_64-linux.$c"
      done <<< "$checks"

---

- name: Create Samba users and set passwords
  become: true
  block:
    - name: Ensure user exists and is in smbusers group
      user:
        name: "{{ item }}"
        groups: smbusers,container-data
        append: true
        create_home: true
      register: user_created

    # TODO: Replace hardcoded password with 1Password lookup
    # e.g. lookup('community.general.onepassword', 'SAMBA_' + (item | upper) + '_PASSWORD', vault='Infrastructure', field='password')
    - name: Set Samba password for user
      shell: "printf '%s\n%s\n' 'mypassword' 'mypassword' | smbpasswd -a -s {{ item }}"
      when: user_created.changed

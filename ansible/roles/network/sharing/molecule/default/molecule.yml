---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: sharing-test-debian
    image: debian:bookworm
    pre_build_image: false
    dockerfile: Dockerfile.j2
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      sharing-test-debian:
        # Mock mounts for Samba shares
        mounts: '[{"name": "shared", "path": "/srv/share"}]'
        samba_users: []

verifier:
  name: ansible

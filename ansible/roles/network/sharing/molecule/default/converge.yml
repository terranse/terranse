---
- name: Converge
  hosts: all
  become: true

  pre_tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.wait_for:
        path: /run/systemd/system
        timeout: 30

  tasks:
    - name: Include network/sharing role
      ansible.builtin.include_role:
        name: network/sharing
      vars:
        # Skip external playbook include that doesn't exist in test
        skip_cockpit_extensions: true

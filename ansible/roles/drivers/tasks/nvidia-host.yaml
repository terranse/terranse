---
# NVIDIA vGPU Host Driver Setup
#
# This task file sets up NVIDIA vGPU on a Proxmox host:
# 1. Blacklists nouveau driver
# 2. Installs prerequisites
# 3. Downloads vGPU drivers from foxipan community alist
# 4. Installs the vGPU-KVM host driver with DKMS
# 5. Configures FastAPI-DLS licensing
# 6. Exposes guest drivers to VMs via virtiofs directory mapping
#
# Required variables:
#   dls_server_ip: IP address of FastAPI-DLS server
#
# Optional variables:
#   vgpu_driver_dir: Directory to store drivers (default: /opt/nvidia-vgpu-drivers)
#   vgpu_version: Specific vGPU version to install (default: latest)
#   nvidia_pci_address: PCI address of GPU (default: auto-detected)

# =============================================================================
# Step 1: Blacklist nouveau driver
# =============================================================================
- name: Check if nouveau is currently loaded
  ansible.builtin.shell: lsmod | grep -q nouveau
  register: nouveau_loaded
  changed_when: false
  failed_when: false

- name: Create nouveau blacklist configuration
  ansible.builtin.copy:
    content: |
      # Blacklist nouveau - required for NVIDIA vGPU
      blacklist nouveau
      blacklist nvidiafb
      options nouveau modeset=0
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    mode: '0644'
  register: nouveau_blacklist

- name: Update initramfs after blacklisting nouveau
  ansible.builtin.command: update-initramfs -u
  when: nouveau_blacklist.changed

- name: Set reboot required flag
  ansible.builtin.set_fact:
    _drivers_reboot_required: true
  when:
    - nouveau_loaded.rc == 0
    - nouveau_blacklist.changed

# Auto-reboot flow (when drivers_auto_reboot is true)
- name: Display reboot warning
  ansible.builtin.debug:
    msg: |
      ========================================
      REBOOT REQUIRED

      The nouveau driver is currently loaded and has been blacklisted.
      A reboot is required before NVIDIA vGPU driver installation can proceed.

      {% if drivers_auto_reboot %}
      Auto-reboot is ENABLED. The system will reboot automatically.
      {% else %}
      Auto-reboot is DISABLED. Please reboot manually and re-run the playbook.
      Set drivers_auto_reboot=true to enable automatic reboots.
      {% endif %}
      ========================================
  when: _drivers_reboot_required | default(false)

- name: Confirm reboot with user
  ansible.builtin.pause:
    prompt: |
      Press ENTER to reboot {{ inventory_hostname }} now, or Ctrl+C to abort.
      The playbook will continue after the system comes back online.
  when:
    - _drivers_reboot_required | default(false)
    - drivers_auto_reboot | bool
    - drivers_reboot_confirm | bool

- name: Reboot to unload nouveau driver
  ansible.builtin.reboot:
    msg: "Rebooting to unload nouveau driver for NVIDIA vGPU installation"
    reboot_timeout: "{{ drivers_reboot_timeout }}"
    post_reboot_delay: 30
  when:
    - _drivers_reboot_required | default(false)
    - drivers_auto_reboot | bool

- name: Verify nouveau is unloaded after reboot
  ansible.builtin.shell: lsmod | grep -q nouveau
  register: nouveau_after_reboot
  changed_when: false
  failed_when: false
  when:
    - _drivers_reboot_required | default(false)
    - drivers_auto_reboot | bool

- name: Fail if nouveau still loaded after reboot
  ansible.builtin.fail:
    msg: "nouveau driver is still loaded after reboot. Check /etc/modprobe.d/blacklist-nouveau.conf and initramfs."
  when:
    - _drivers_reboot_required | default(false)
    - drivers_auto_reboot | bool
    - nouveau_after_reboot.rc == 0

# Manual reboot flow (when drivers_auto_reboot is false)
- name: Fail if nouveau is loaded (manual reboot required)
  ansible.builtin.fail:
    msg: |
      nouveau driver is loaded. Reboot required before continuing.
      To enable automatic reboot, set: drivers_auto_reboot=true
  when:
    - _drivers_reboot_required | default(false)
    - not (drivers_auto_reboot | bool)

# =============================================================================
# Step 2: Unbind GPU from vfio-pci if needed
# =============================================================================
- name: Detect NVIDIA GPU PCI address
  ansible.builtin.shell: |
    lspci -nn | grep -i nvidia | grep -i 'vga\|3d' | head -1 | cut -d' ' -f1
  register: nvidia_pci_detect
  changed_when: false
  when: nvidia_pci_address is not defined

- name: Set NVIDIA PCI address fact
  ansible.builtin.set_fact:
    nvidia_pci_address: "{{ nvidia_pci_address | default(nvidia_pci_detect.stdout) }}"

- name: Check current GPU driver binding
  ansible.builtin.shell: |
    lspci -nnk -s {{ nvidia_pci_address }} | grep 'Kernel driver' | awk '{print $NF}'
  register: gpu_current_driver
  changed_when: false

- name: Remove GPU from vfio-pci IDs if bound
  when: gpu_current_driver.stdout == 'vfio-pci'
  block:
    - name: Get NVIDIA GPU device IDs
      ansible.builtin.shell: |
        lspci -n -s {{ nvidia_pci_address }} | awk '{print $3}'
      register: nvidia_device_id
      changed_when: false

    - name: Remove NVIDIA device IDs from vfio-pci modprobe config
      ansible.builtin.lineinfile:
        path: /etc/modprobe.d/vfio.conf
        regexp: '.*{{ nvidia_device_id.stdout }}.*'
        state: absent
      register: vfio_config_changed
      failed_when: false

    - name: Update initramfs after vfio-pci changes
      ansible.builtin.command: update-initramfs -u
      when: vfio_config_changed.changed | default(false)

    - name: Set reboot required for vfio unbind
      ansible.builtin.set_fact:
        _drivers_reboot_required_vfio: true
      when: vfio_config_changed.changed | default(false)

    - name: Reboot to release GPU from vfio-pci
      ansible.builtin.reboot:
        msg: "Rebooting to release GPU from vfio-pci for vGPU driver"
        reboot_timeout: "{{ drivers_reboot_timeout }}"
        post_reboot_delay: 30
      when:
        - _drivers_reboot_required_vfio | default(false)
        - drivers_auto_reboot | bool

# =============================================================================
# Step 3: Install prerequisites
# =============================================================================
- name: Install build prerequisites for NVIDIA driver
  ansible.builtin.apt:
    name:
      - build-essential
      - dkms
      - "proxmox-headers-{{ ansible_kernel }}"
      - python3
    state: present
    update_cache: true

# =============================================================================
# Step 4: Download vGPU drivers from foxipan
# =============================================================================
- name: Create vGPU driver directory
  ansible.builtin.file:
    path: "{{ vgpu_driver_dir }}"
    state: directory
    mode: '0755'

- name: Copy vGPU driver download script
  ansible.builtin.copy:
    src: get-vgpu-drivers.py
    dest: /usr/local/bin/get-vgpu-drivers.py
    mode: '0755'

- name: Check if vGPU drivers already downloaded
  ansible.builtin.stat:
    path: "{{ vgpu_driver_dir }}/VERSION.json"
  register: existing_drivers

- name: Download vGPU drivers
  ansible.builtin.command:
    cmd: >-
      /usr/local/bin/get-vgpu-drivers.py
      -d "{{ vgpu_driver_dir }}"
      {{ ('-v ' + vgpu_version) if vgpu_version is defined else '' }}
  when: not existing_drivers.stat.exists
  register: driver_download

# =============================================================================
# Step 5: Install NVIDIA vGPU host driver
# =============================================================================
- name: Find downloaded host driver
  ansible.builtin.find:
    paths: "{{ vgpu_driver_dir }}/host"
    patterns: "NVIDIA-Linux-x86_64-*-vgpu-kvm.run"
  register: host_driver_file

- name: Check if NVIDIA driver is already installed
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_check
  changed_when: false
  failed_when: false

- name: Make driver installer executable
  ansible.builtin.file:
    path: "{{ host_driver_file.files[0].path }}"
    mode: '0755'
  when: host_driver_file.matched > 0

- name: Install NVIDIA vGPU host driver
  ansible.builtin.command:
    cmd: "{{ host_driver_file.files[0].path }} --dkms --silent"
  when:
    - host_driver_file.matched > 0
    - nvidia_smi_check.rc != 0
  register: driver_install
  notify: Reboot host for NVIDIA driver

- name: Verify NVIDIA driver loaded
  ansible.builtin.command: nvidia-smi
  register: nvidia_smi_verify
  changed_when: false
  failed_when: false

- name: Display NVIDIA driver status
  ansible.builtin.debug:
    msg: "{{ nvidia_smi_verify.stdout | default('Driver not loaded - reboot required') }}"

# =============================================================================
# Step 6: Configure FastAPI-DLS licensing
# =============================================================================
- name: Ensure gridd.conf directory exists
  ansible.builtin.file:
    path: /etc/nvidia
    state: directory
    mode: '0755'

- name: Configure FastAPI-DLS licensing server
  ansible.builtin.template:
    src: gridd.conf.j2
    dest: /etc/nvidia/gridd.conf
    mode: '0644'
  when: dls_server_ip is defined

- name: Warn if DLS server not configured
  ansible.builtin.debug:
    msg: |
      WARNING: dls_server_ip is not defined.
      vGPU licensing will not be configured.
      Set dls_server_ip to the IP of your FastAPI-DLS server.
  when: dls_server_ip is not defined

# =============================================================================
# Step 7: Expose guest drivers via virtiofs directory mapping
# =============================================================================
- name: Create Proxmox directory mapping for guest drivers
  ansible.builtin.command:
    cmd: >-
      pvesh create /cluster/mapping/dir
      --id nvidia-guest-drivers
      --map {{ ansible_hostname }}={{ vgpu_driver_dir }}/guest
      --description "NVIDIA vGPU guest drivers (shared via virtiofs)"
  register: dir_mapping_create
  changed_when: dir_mapping_create.rc == 0
  failed_when: false

- name: Update Proxmox directory mapping if it already exists
  ansible.builtin.command:
    cmd: >-
      pvesh set /cluster/mapping/dir/nvidia-guest-drivers
      --map {{ ansible_hostname }}={{ vgpu_driver_dir }}/guest
      --description "NVIDIA vGPU guest drivers (shared via virtiofs)"
  when: dir_mapping_create.rc != 0
  changed_when: true
  failed_when: false

# =============================================================================
# Step 7a: Enable vGPU SR-IOV (compute display mode + VFs + PCI mapping)
# =============================================================================
- name: Enable NVIDIA vGPU SR-IOV on the host
  ansible.builtin.include_tasks: nvidia-vgpu-sriov.yaml

# =============================================================================
# Step 7b: vGPU profile drift guard
#
# Assert the mdev type ids the terraform vgpu_profiles map relies on still
# resolve to the expected profiles on this driver. Only runs when SR-IOV VFs
# already exist (the guard is meaningless before they do), so it degrades to a
# no-op on a host where vGPU isn't enabled yet rather than failing spuriously.
# =============================================================================
- name: Read available vGPU types from a virtual function
  ansible.builtin.shell: |
    set -o pipefail
    f=$(ls /sys/bus/pci/devices/*/virtfn0/nvidia/creatable_vgpu_types 2>/dev/null | head -1)
    if [ -n "$f" ]; then cat "$f"; fi
  args:
    executable: /bin/bash
  register: vgpu_creatable_types
  changed_when: false
  when: vgpu_profile_checks | default({}) | length > 0

- name: Assert vGPU profile ids still map to expected profiles
  ansible.builtin.assert:
    that:
      - 'vgpu_creatable_types.stdout | regex_search("^\s*" ~ (item.key | regex_replace("^nvidia-", "")) ~ "\s*:.*" ~ item.value, multiline=True) is not none'
    fail_msg: >-
      vGPU profile drift detected: mdev type '{{ item.key }}' no longer maps to a
      profile matching '{{ item.value }}' on this driver branch. The terraform
      vgpu_profiles map (and vgpu_profile_checks) are stale. Re-derive the ids with:
      cat /sys/bus/pci/devices/<vf>/nvidia/creatable_vgpu_types
    success_msg: "vGPU profile {{ item.key }} -> {{ item.value }} OK"
  loop: "{{ vgpu_profile_checks | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - vgpu_profile_checks | default({}) | length > 0
    - vgpu_creatable_types.stdout | default('') | length > 0

# =============================================================================
# Step 8: Systemd timer for periodic driver updates
# =============================================================================
- name: Create systemd service for vGPU driver fetcher
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Fetch newest NVIDIA vGPU drivers from foxipan
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/get-vgpu-drivers.py -d {{ vgpu_driver_dir }}
    dest: /etc/systemd/system/vgpu-driver-fetch.service
    mode: '0644'

- name: Create systemd timer for daily driver checks
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Check for vGPU driver updates daily

      [Timer]
      OnCalendar=03:00
      Persistent=true

      [Install]
      WantedBy=timers.target
    dest: /etc/systemd/system/vgpu-driver-fetch.timer
    mode: '0644'

- name: Enable vGPU driver fetch timer
  ansible.builtin.systemd:
    name: vgpu-driver-fetch.timer
    enabled: true
    state: started
    daemon_reload: true

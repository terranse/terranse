---
# Default variables for the llm role
#
# Deploys Ollama (serving local coding models) and the Hermes agent CLI on a
# VM holding the full 24Q vGPU slice. See docs/superpowers/specs/2026-08-11-ai-vm-local-llm-design.md.

# System user that owns the Hermes CLI and its config. Ollama runs as its own
# "ollama" user, created by the upstream install script.
llm_user: llm

gpu_type: nvidia_vgpu

# Bind all interfaces, not just localhost, so the OpenAI-compatible API is
# reachable over the LAN/Netbird for future clients, not only Hermes on-box.
llm_ollama_bind: "0.0.0.0:11434"

# Keep the model resident instead of unloading after Ollama's default 5 minutes.
# Reloading a ~18GB model off disk is a multi-second stall on the first prompt
# after any idle period, which reads as "the agent is slow" far more than decode
# speed does. "-1" = never unload; "0" = unload immediately.
llm_ollama_keep_alive: "-1"

# Flash attention is a prerequisite for a quantised KV cache — setting
# llm_ollama_kv_cache_type without it silently leaves the cache at f16.
llm_ollama_flash_attention: "1"

# q4_0 rather than q8_0. Normally q4_0 KV costs measurable accuracy, but Qwen3.8
# is a hybrid model: only ~16 of its 65 layers use full attention (measured —
# KV costs 34,000 B/token against the 141,440 B/token the geometry implies for
# 65 full-attention layers), and the linear-attention layers around them absorb
# the quantisation noise. Upstream measured token-identical output between f16
# and q4_0 on this exact architecture family (ggml-org/llama.cpp#21385). Halving
# KV is what buys 128K instead of 64K — see llm_ollama_context_length.
llm_ollama_kv_cache_type: "q4_0"

# Ollama does NOT default to the model's advertised window. Unset, it picks
# "4k/32k/256k based on VRAM" (`ollama serve --help`) — 32K on this 24Q slice,
# while Qwen3.8 advertises 262144. Hermes reads the 262144 from /api/show and
# sizes its context meter and compaction budget against it, so it believed it
# was 12% full when the server was already out of room and every long turn came
# back finish_reason="length". Hermes DOES try to correct this by sending
# options.num_ctx, but Ollama's OpenAI-compatible /v1 endpoint ignores `options`
# (verified live) — so this env var is the only thing that sets the real window.
#
# 131072 is the measured ceiling that stays 100% on the GPU. Ollama keeps a
# 1936 MiB reserve, leaving a 19,269 MiB budget; 128K/q4_0 projects 19,111 MiB.
# 160K projected 19,847 and 256K projected 22,055 — both spilled layers to CPU.
# Keep llm_ollama_context_length and the Hermes model.context_length in
# hermes.yaml in step: if Hermes thinks the window is larger than this, it will
# never compact in time and the truncation returns.
llm_ollama_context_length: "131072"

# Minimum Ollama release. Model manifests declare an engine floor, so an old
# Ollama cannot pull a newly published model — it fails with HTTP 412
# "requires a newer version of Ollama". Raise this when adding a model that
# needs a newer engine; the role upgrades in place to satisfy it.
# 0.32.9 could not pull Qwen3.8 (verified on ai-vm, 2026-08-20).
llm_ollama_min_version: "0.32.15"

# Models to `ollama pull` on deploy. Tags verified against the live Ollama
# library on 2026-08-19 — `ollama pull` 404s on a tag that doesn't exist, so
# re-check https://ollama.com/library/<model>/tags before editing these.
# Devstral is published as `devstral`, not `devstral-small2`, and carries its
# release date in the tag rather than a "small 2" version suffix.
#
# Qwen3.8 rather than 3.6: it is the newer model, and it is the generation the
# ninfer backend serves, so the two engines can be compared on equal terms.
# The -mtp- variant is multi-token prediction — identical weights and
# quantisation, faster decode. The plain tag is kept alongside it so the two
# can be measured against each other without a re-download.
llm_ollama_models:
  - "qwen3.8:27b-mtp-q4_K_M"
  - "qwen3.8:27b-q4_K_M"
  - "devstral:24b-small-2505-q4_K_M"

# Model Hermes defaults to on first run.
llm_default_model: "{{ llm_ollama_models[0] }}"

# Docker + NVIDIA Container Toolkit. Required by the ninfer backend, and by the
# planned Open WebUI / ComfyUI containers regardless of which backend wins.
llm_docker_enabled: true

# --- Open WebUI + Hermes gateway ------------------------------------------
#
# Open WebUI talks to the Hermes gateway's OpenAI-compatible API server, not to
# Ollama, so the browser drives the agent and its full toolset. That also makes
# every client backend-agnostic: swapping the inference engine never touches the
# phone or the browser.
llm_webui_enabled: true

# The API server lives inside `hermes gateway`, so the gateway needs to be a
# service rather than something started from a login shell.
llm_hermes_api_server_port: 8642
# Overwritten at run time with the docker bridge gateway, so Open WebUI can
# reach it via host.docker.internal. Left as loopback here so that a run with
# Docker disabled still binds somewhere sane rather than to every interface.
llm_hermes_api_server_host: "127.0.0.1"
llm_hermes_workdir: "/home/{{ llm_user }}"

# llm_hermes_api_key is vaulted in ansible/secrets.yaml — never give it a
# default here, or a missing vault would silently deploy a guessable key.

llm_openwebui_dir: /var/lib/open-webui
llm_openwebui_port: 3000
llm_openwebui_name: "Hermes"
# Pinned rather than :main — an unpinned tag means every deploy is a silent
# upgrade of a service that holds accounts and chat history.
llm_openwebui_image: "ghcr.io/open-webui/open-webui:v0.6.18"

# --- ComfyUI ---------------------------------------------------------------
#
# Installed but not enabled: ComfyUI is an EXCLUSIVE GPU tenant. Starting it
# stops Ollama and stopping it starts Ollama again, because Flux (12-17 GiB) and
# Qwen3.8 (~17 GiB) cannot both live in a 24 GiB slice.
llm_comfyui_enabled: true
llm_comfyui_dir: /var/lib/comfyui
llm_comfyui_port: 8188
llm_comfyui_image: "yanwk/comfyui-boot:cu124-slim"

# Flux weights. Left empty by default: they are ~12 GiB and which quant to use
# depends on what else is on the slice at the time. Add entries as
# {url, dest, checksum} — dest is relative to llm_comfyui_dir, checksum is the
# "sha256:..." form get_url expects, so a truncated download fails loudly.
llm_comfyui_models: []

# --- NInfer ----------------------------------------------------------------
#
# NInfer — a native SM86 CUDA inference engine (Apache-2.0). Faster than Ollama
# on this hardware but single-model and single-purpose, so it does not replace
# Ollama; llm_backend picks which one is live. The A5000 is GA102/sm_86, the
# same as the RTX 3090 this fork targets, and upstream has no device gating.
llm_ninfer_enabled: false
llm_ninfer_repo: "https://github.com/Don-Chad/ninfer-3090"

# Pinned commit, not a branch: the default branch is a release branch that
# upstream force-updates, and a silently different build is the last thing we
# want between two benchmark runs. This is not hypothetical — the branch this
# commit once sat on (release/v0.6.0-rtx3090) has since been force-moved, so
# only the SHA still names the engine these flags were verified against.
llm_ninfer_ref: "403fc56d71576aa1feddb771cfed3264e7378b20"

llm_ninfer_src_dir: /opt/ninfer/src
llm_ninfer_model_dir: /opt/ninfer/models

# Pinned to a HuggingFace REVISION, not to `main`. Upstream replaced the
# artifact on main with one carrying DFlash2 companion weights, which the
# engine above cannot consume — it aborts with "artifact object was not
# consumed by the selected target: dflash2/feature_projection", and the
# `--spec dflash2` that would consume them does not exist in this build. The
# engine ref and the artifact revision are a matched pair; move both or
# neither.
llm_ninfer_model_url: "https://huggingface.co/neroued/Qwen3.8-27B-NInfer/resolve/18dfc887423f/qwen3_8_27b.ninfer"
llm_ninfer_model_sha256: "eec39564993d6e9c7d5e383382a760f093465c9d163ec9a1bd6b80199514bf3e"
llm_ninfer_port: 8080

# NInfer advertises the artifact's own identity.model_id and rejects a request
# whose "model" field is anything else — including omitting it, which returns
# 400. Confirm with: curl -s http://ai-vm.edholm.cc:8080/v1/models
llm_ninfer_model_id: "qwen3.8-27b"

# Matches llm_ollama_context_length so a backend switch does not move the
# window under Hermes. This only fits with ECC DISABLED on the physical A5000:
# at 131072 the KV cache needs 5,306,938,624 B plus 1,073,741,824 B headroom,
# and with ECC on there were only 5,121,457,152 B left after weights — 185 MB
# short. `nvidia-smi -e 0` on the Proxmox host returns ~1,536 MiB, which covers
# it eight times over. If a host rebuild re-enables ECC, this must drop to
# 98304 or NInfer will refuse to start.
llm_ninfer_max_context: "131072"

# Empty means the server runs without auth, which is fine on the LAN. Set this
# from the vault before exposing the port over ipid.
llm_ninfer_api_key: ""

# Which inference backend owns the GPU. Both stay installed; only the selected
# one is enabled and started. They cannot coexist — Ollama holds ~19.1 GiB and
# NInfer ~20.0 GiB of a 24 GiB slice — so the unit file also declares Conflicts=.
llm_backend: ollama

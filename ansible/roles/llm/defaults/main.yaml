---
# Default variables for the llm role
#
# Deploys Ollama (serving local coding models) and the Hermes agent CLI on a
# VM holding the full 24Q vGPU slice. See docs/superpowers/specs/2026-08-11-ai-vm-local-llm-design.md.

# System user that owns the Hermes CLI and its config. Ollama runs as its own
# "ollama" user, created by the upstream install script.
llm_user: llm

gpu_type: nvidia_vgpu

# Bind all interfaces, not just localhost, so the OpenAI-compatible API is
# reachable over the LAN/Netbird for future clients, not only Hermes on-box.
llm_ollama_bind: "0.0.0.0:11434"

# Keep the model resident instead of unloading after Ollama's default 5 minutes.
# Reloading a ~18GB model off disk is a multi-second stall on the first prompt
# after any idle period, which reads as "the agent is slow" far more than decode
# speed does. "-1" = never unload; "0" = unload immediately.
llm_ollama_keep_alive: "-1"

# Flash attention is a prerequisite for a quantised KV cache — setting
# llm_ollama_kv_cache_type without it silently leaves the cache at f16.
llm_ollama_flash_attention: "1"
llm_ollama_kv_cache_type: "q8_0"

# Minimum Ollama release. Model manifests declare an engine floor, so an old
# Ollama cannot pull a newly published model — it fails with HTTP 412
# "requires a newer version of Ollama". Raise this when adding a model that
# needs a newer engine; the role upgrades in place to satisfy it.
# 0.32.9 could not pull Qwen3.8 (verified on ai-vm, 2026-08-20).
llm_ollama_min_version: "0.32.15"

# Models to `ollama pull` on deploy. Tags verified against the live Ollama
# library on 2026-08-19 — `ollama pull` 404s on a tag that doesn't exist, so
# re-check https://ollama.com/library/<model>/tags before editing these.
# Devstral is published as `devstral`, not `devstral-small2`, and carries its
# release date in the tag rather than a "small 2" version suffix.
#
# Qwen3.8 rather than 3.6: it is the newer model, and it is the generation the
# ninfer backend serves, so the two engines can be compared on equal terms.
# The -mtp- variant is multi-token prediction — identical weights and
# quantisation, faster decode. The plain tag is kept alongside it so the two
# can be measured against each other without a re-download.
llm_ollama_models:
  - "qwen3.8:27b-mtp-q4_K_M"
  - "qwen3.8:27b-q4_K_M"
  - "devstral:24b-small-2505-q4_K_M"

# Model Hermes defaults to on first run.
llm_default_model: "{{ llm_ollama_models[0] }}"

# Docker + NVIDIA Container Toolkit. Required by the ninfer backend, and by the
# planned Open WebUI / ComfyUI containers regardless of which backend wins.
llm_docker_enabled: true

# --- Open WebUI + Hermes gateway ------------------------------------------
#
# Open WebUI talks to the Hermes gateway's OpenAI-compatible API server, not to
# Ollama, so the browser drives the agent and its full toolset. That also makes
# every client backend-agnostic: swapping the inference engine never touches the
# phone or the browser.
llm_webui_enabled: true

# The API server lives inside `hermes gateway`, so the gateway needs to be a
# service rather than something started from a login shell.
llm_hermes_api_server_port: 8642
# Overwritten at run time with the docker bridge gateway, so Open WebUI can
# reach it via host.docker.internal. Left as loopback here so that a run with
# Docker disabled still binds somewhere sane rather than to every interface.
llm_hermes_api_server_host: "127.0.0.1"
llm_hermes_workdir: "/home/{{ llm_user }}"

# llm_hermes_api_key is vaulted in ansible/secrets.yaml — never give it a
# default here, or a missing vault would silently deploy a guessable key.

llm_openwebui_dir: /var/lib/open-webui
llm_openwebui_port: 3000
llm_openwebui_name: "Hermes"
# Pinned rather than :main — an unpinned tag means every deploy is a silent
# upgrade of a service that holds accounts and chat history.
llm_openwebui_image: "ghcr.io/open-webui/open-webui:v0.6.18"

# --- ComfyUI ---------------------------------------------------------------
#
# Installed but not enabled: ComfyUI is an EXCLUSIVE GPU tenant. Starting it
# stops Ollama and stopping it starts Ollama again, because Flux (12-17 GiB) and
# Qwen3.8 (~17 GiB) cannot both live in a 24 GiB slice.
llm_comfyui_enabled: true
llm_comfyui_dir: /var/lib/comfyui
llm_comfyui_port: 8188
llm_comfyui_image: "yanwk/comfyui-boot:cu124-slim"

# Flux weights. Left empty by default: they are ~12 GiB and which quant to use
# depends on what else is on the slice at the time. Add entries as
# {url, dest, checksum} — dest is relative to llm_comfyui_dir, checksum is the
# "sha256:..." form get_url expects, so a truncated download fails loudly.
llm_comfyui_models: []

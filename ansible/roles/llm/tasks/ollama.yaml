---
# Ollama install, network bind, and model pull.
#
# The upstream installer (https://ollama.com/install.sh) creates the `ollama`
# system user, the systemd unit, and detects the NVIDIA GPU via nvidia-smi —
# so this must run after the vGPU guest driver task in main.yaml.

- name: Check whether Ollama is already installed
  ansible.builtin.command: ollama --version
  register: llm_ollama_check
  changed_when: false
  failed_when: false

# "ollama version is X.Y.Z" when present; rc != 0 when the binary is missing,
# in which case 0.0.0 forces the install below.
- name: Record the installed Ollama version
  ansible.builtin.set_fact:
    llm_ollama_installed_version: >-
      {{ (llm_ollama_check.stdout | regex_search('[0-9]+\.[0-9]+\.[0-9]+'))
         if llm_ollama_check.rc == 0 else '0.0.0' }}

# Model manifests carry a minimum engine version. Pulling a model newer than the
# installed Ollama fails with "412 ... requires a newer version of Ollama", and
# the previous version of this task only ran when the binary was absent — so a VM
# provisioned months ago would sit on its original release forever and silently
# lose access to new models. Qwen3.8 hit exactly this against 0.32.9.
- name: Install or upgrade Ollama
  ansible.builtin.shell: curl -fsSL https://ollama.com/install.sh | sh
  args:
    executable: /bin/bash
  when: llm_ollama_installed_version is version(llm_ollama_min_version, '<')

- name: Ensure the ollama systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: '0755'

# Renamed from bind.conf: this drop-in now carries tuning as well as the bind
# address, and systemd merges every *.conf in the directory — a leftover
# bind.conf would keep setting a stale OLLAMA_HOST alongside the new file.
- name: Remove the superseded bind-only drop-in
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d/bind.conf
    state: absent
  notify:
    - Reload systemd
    - Restart ollama

- name: Configure Ollama's bind address and tuning
  ansible.builtin.template:
    src: ollama-env.conf.j2
    dest: /etc/systemd/system/ollama.service.d/env.conf
    mode: '0644'
  notify:
    - Reload systemd
    - Restart ollama

# Only when Ollama is the selected backend. ninfer.service declares
# Conflicts=ollama.service, so starting Ollama here stops NInfer -- and
# backend.yaml, a few tasks later, stops Ollama and starts NInfer again. That
# round trip is invisible in the play's output and costs a 90s artifact reload
# on every single run, for a service that is about to be stopped anyway.
- name: Enable and start Ollama
  ansible.builtin.systemd:
    name: ollama
    enabled: true
    state: started
    daemon_reload: true
  when: llm_backend == 'ollama'

- name: Flush handlers so the bind takes effect before pulling models
  ansible.builtin.meta: flush_handlers

# `ollama list` talks to the server, so it can only answer while the server is
# the live backend. Under NInfer the pull below is skipped with it: models are
# fetched by whichever backend is selected, and flipping back to Ollama re-runs
# this role and pulls whatever is missing then.
- name: Read the models already present
  ansible.builtin.command: ollama list
  register: llm_ollama_installed
  changed_when: false
  when: llm_backend == 'ollama'

# Ask which models are missing rather than pulling unconditionally and trying to
# read "did anything download" back out of the progress output: `ollama pull`
# prints a success line either way, so any changed_when over its stdout reports
# changed on every run and re-verifies ~50GB of weights each time.
- name: Pull configured models
  ansible.builtin.command: "ollama pull {{ item }}"
  loop: "{{ llm_ollama_models }}"
  when:
    - llm_backend == 'ollama'
    - item not in llm_ollama_installed.stdout
  changed_when: true
  async: 3600
  poll: 30

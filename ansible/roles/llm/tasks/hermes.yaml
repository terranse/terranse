---
# Hermes agent CLI (https://github.com/NousResearch/hermes-agent) install and
# provider wiring. Installed per-user (bundles its own uv/Python 3.11/Node),
# so it runs as llm_user rather than system-wide.

- name: Check whether Hermes is already installed for the llm user
  ansible.builtin.command: bash -lc "command -v hermes"
  become: true
  become_user: "{{ llm_user }}"
  register: llm_hermes_check
  changed_when: false
  failed_when: false

- name: Install Hermes agent CLI
  ansible.builtin.shell: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ llm_user }}"
  when: llm_hermes_check.rc != 0

# Hermes reads its provider from ~/.hermes/config.yaml, NOT from OPENAI_BASE_URL
# / OPENAI_API_KEY — pointing it with those env vars leaves it on its default
# provider, which answers "HTTP 401: Missing Authentication header". Worse,
# exporting OPENAI_API_KEY globally is what the `openrouter` provider keys off,
# so a placeholder value there can send traffic somewhere unintended. `ollama`
# is an alias for the `custom` OpenAI-compatible provider.
- name: Remove the superseded Hermes environment file
  ansible.builtin.file:
    path: /etc/profile.d/hermes-llm.sh
    state: absent

- name: Point Hermes at the local Ollama endpoint
  ansible.builtin.shell: |
    set -euo pipefail
    # The installer puts hermes in ~/.local/bin, which only a login shell adds
    # to PATH; this task does not get one.
    export PATH="$HOME/.local/bin:$PATH"
    current="$(hermes config get {{ item.key }} 2>/dev/null | tail -1 || true)"
    if [ "$current" != "{{ item.value }}" ]; then
      hermes config set {{ item.key }} "{{ item.value }}"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ llm_user }}"
  loop:
    - key: model.provider
      value: ollama
    - key: model.base_url
      value: "http://localhost:11434/v1"
    - key: model.default
      value: "{{ llm_default_model }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  register: llm_hermes_config_set
  changed_when: "'CHANGED' in llm_hermes_config_set.stdout"

---
# Hermes agent CLI (https://github.com/NousResearch/hermes-agent) install and
# provider wiring. Installed per-user (bundles its own uv/Python 3.11/Node),
# so it runs as llm_user rather than system-wide.

- name: Check whether Hermes is already installed for the llm user
  ansible.builtin.command: bash -lc "command -v hermes"
  become: true
  become_user: "{{ llm_user }}"
  register: llm_hermes_check
  changed_when: false
  failed_when: false

- name: Install Hermes agent CLI
  ansible.builtin.shell: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ llm_user }}"
  when: llm_hermes_check.rc != 0

# Hermes reads its provider from ~/.hermes/config.yaml, NOT from OPENAI_BASE_URL
# / OPENAI_API_KEY — pointing it with those env vars leaves it on its default
# provider, which answers "HTTP 401: Missing Authentication header". Worse,
# exporting OPENAI_API_KEY globally is what the `openrouter` provider keys off,
# so a placeholder value there can send traffic somewhere unintended. `ollama`
# is an alias for the `custom` OpenAI-compatible provider.
- name: Remove the superseded Hermes environment file
  ansible.builtin.file:
    path: /etc/profile.d/hermes-llm.sh
    state: absent

# TODO: when llm_ninfer_api_key is set (i.e. once this is exposed over ipid),
# Hermes needs the matching bearer token. The config key for that is NOT yet
# verified — run `hermes config list` on-box to find its name, then add it to
# the loop below guarded on llm_backend == 'ninfer'.
- name: Point Hermes at the active inference backend
  ansible.builtin.shell: |
    set -euo pipefail
    # The installer puts hermes in ~/.local/bin, which only a login shell adds
    # to PATH; this task does not get one.
    export PATH="$HOME/.local/bin:$PATH"
    current="$(hermes config get {{ item.key }} 2>/dev/null | tail -1 || true)"
    if [ "$current" != "{{ item.value }}" ]; then
      hermes config set {{ item.key }} "{{ item.value }}"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ llm_user }}"
  loop:
    # Both names select the same OpenAI-compatible profile — `ollama` is an
    # alias of `custom` — but the alias also switches on Hermes's Ollama-specific
    # discovery, which probes the native /api/show. NInfer serves only /v1 and
    # 404s that, so NInfer must use the bare `custom` name.
    - key: model.provider
      value: "{{ 'custom' if llm_backend == 'ninfer' else 'ollama' }}"
    - key: model.base_url
      value: "{{ 'http://localhost:' ~ llm_ninfer_port ~ '/v1' if llm_backend == 'ninfer' else 'http://localhost:11434/v1' }}"
    # NInfer rejects any "model" value that is not the artifact's own
    # identity.model_id, including an absent one.
    - key: model.default
      value: "{{ llm_ninfer_model_id if llm_backend == 'ninfer' else llm_default_model }}"
    # Hermes otherwise takes the window from the backend's own discovery, which
    # for Ollama reports the model's architectural 262144 rather than what was
    # actually loaded. It sizes the context meter AND the compaction trigger
    # (compression.threshold * window) off that number, so it sat at "12% used"
    # while the server was full and never compacted, and every long turn came
    # back finish_reason="length". Must match the live backend's real window.
    - key: model.context_length
      value: "{{ llm_ninfer_max_context if llm_backend == 'ninfer' else llm_ollama_context_length }}"
    # Hermes generates conversation titles with a response_format=json_schema
    # request. NInfer does not implement structured outputs and returns 400, so
    # every new conversation would open with an error banner. Ollama handles it.
    - key: title_generation.enabled
      value: "{{ 'false' if llm_backend == 'ninfer' else 'true' }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  register: llm_hermes_config_set
  changed_when: "'CHANGED' in llm_hermes_config_set.stdout"

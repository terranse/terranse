---
# Handlers for the llm role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart ollama
  ansible.builtin.systemd:
    name: ollama
    state: restarted

- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart hermes-gateway
  ansible.builtin.systemd:
    name: hermes-gateway
    state: restarted

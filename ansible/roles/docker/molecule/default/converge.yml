---
- name: Converge
  hosts: all
  become: true

  vars:
    # Override geerlingguy.docker settings for container environment
    docker_install_compose_plugin: true
    docker_users:
      - default-user
    # The docker group variable used by the role
    docker_group: docker

  pre_tasks:
    - name: Wait for systemd to be ready
      ansible.builtin.wait_for:
        path: /run/systemd/system
        timeout: 30

  tasks:
    - name: Include docker role
      ansible.builtin.include_role:
        name: docker

  post_tasks:
    - name: Start docker compose services
      community.docker.docker_compose_v2:
        project_src: /opt/docker
        state: present
      register: compose_result
      retries: 3
      delay: 10
      until: compose_result is succeeded

    - name: Wait for services to initialize
      ansible.builtin.pause:
        seconds: 15

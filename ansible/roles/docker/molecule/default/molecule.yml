---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yaml

driver:
  name: docker

platforms:
  - name: docker-test-debian
    image: debian:bookworm
    pre_build_image: false
    dockerfile: Dockerfile.j2
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:${HOME}/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
  inventory:
    host_vars:
      docker-test-debian:
        docker_services: '[{"name": "jellyfin"}]'
        mounts: '[{"name": "config", "path": "/appdata"}, {"name": "tv_series", "path": "/media/tv"}, {"name": "movies", "path": "/media/movies"}]'

verifier:
  name: ansible

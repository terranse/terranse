---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../../requirements.yaml

driver:
  name: vagrant
  provider:
    name: libvirt
    options:
      memory: 2048
      cpus: 2
      nested: true
      cpu_mode: host-passthrough

platforms:
  - name: docker-vagrant-debian
    box: debian/bookworm64
    instance_raw_config_args:
      - "vm.synced_folder '.', '/vagrant', disabled: true"

provisioner:
  name: ansible
  playbooks:
    converge: ../default/converge.yml
    verify: ../default/verify.yml
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:${HOME}/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
  inventory:
    host_vars:
      docker-vagrant-debian:
        docker_services: '[{"name": "jellyfin"}]'
        mounts: '[{"name": "config", "path": "/appdata"}, {"name": "tv_series", "path": "/media/tv"}, {"name": "movies", "path": "/media/movies"}]'

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

---
- name: Verify - E2E Docker Services Test
  hosts: all
  become: true

  tasks:
    - name: Get list of running containers
      ansible.builtin.command: docker ps --format "{{ '{{' }}.Names{{ '}}' }}"
      register: running_containers
      changed_when: false

    - name: Display running containers
      ansible.builtin.debug:
        msg: "Running containers: {{ running_containers.stdout_lines }}"

    # Jellyfin checks
    - name: Verify jellyfin container is running
      ansible.builtin.assert:
        that:
          - "'jellyfin' in running_containers.stdout"
        fail_msg: "Jellyfin container is not running"
        success_msg: "Jellyfin container is running"

    - name: Check jellyfin port is listening
      ansible.builtin.wait_for:
        port: 8096
        timeout: 60
        state: started
      register: jellyfin_port

    - name: Verify jellyfin is responding
      ansible.builtin.uri:
        url: http://localhost:8096
        method: GET
        status_code: [200, 302, 401]
        timeout: 30
      register: jellyfin_response
      retries: 5
      delay: 10
      until: jellyfin_response is succeeded
      ignore_errors: true

    # Jellyseerr checks
    - name: Verify jellyseerr container is running
      ansible.builtin.assert:
        that:
          - "'jellyseerr' in running_containers.stdout"
        fail_msg: "Jellyseerr container is not running"
        success_msg: "Jellyseerr container is running"

    # Vikunja checks
    - name: Verify vikunja container is running
      ansible.builtin.assert:
        that:
          - "'vikunja' in running_containers.stdout"
        fail_msg: "Vikunja container is not running"
        success_msg: "Vikunja container is running"
      ignore_errors: true  # May fail due to DB dependency

    # Authentik checks
    - name: Verify authentik server container is running
      ansible.builtin.assert:
        that:
          - "'server' in running_containers.stdout or 'authentik' in running_containers.stdout"
        fail_msg: "Authentik server container is not running"
        success_msg: "Authentik server container is running"
      ignore_errors: true  # May take time to start

    # Docker compose file checks
    - name: Verify all docker-compose files were generated
      ansible.builtin.stat:
        path: "/opt/docker/{{ item }}"
      register: compose_files
      loop:
        - docker-compose.yaml
        - common.yaml
        - jellyfin.yaml
        - vikunja.yaml
        - authentik.yaml

    - name: Assert all compose files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "{{ item.item }} was not generated"
        success_msg: "{{ item.item }} exists"
      loop: "{{ compose_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Validate compose configuration
    - name: Validate docker compose configuration
      ansible.builtin.command: docker compose config
      args:
        chdir: /opt/docker
      register: compose_config
      changed_when: false

    - name: Assert compose config is valid
      ansible.builtin.assert:
        that:
          - compose_config.rc == 0
        fail_msg: "Docker compose configuration is invalid"
        success_msg: "Docker compose configuration is valid"

    # Summary
    - name: Get container count
      ansible.builtin.command: docker ps -q
      register: container_count
      changed_when: false

    - name: Display test summary
      ansible.builtin.debug:
        msg: |
          ========== E2E TEST SUMMARY ==========
          Total running containers: {{ container_count.stdout_lines | length }}
          Containers: {{ running_containers.stdout_lines | join(', ') }}
          Jellyfin responding: {{ jellyfin_response is succeeded }}
          =======================================

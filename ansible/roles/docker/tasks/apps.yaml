- name: Generate docker-compose files for selected apps
  notify: Restart docker apps
  when: docker_services is defined and docker_services != ''
  block:
    # Normalize docker_services to always be a list (supports both JSON string and native list)
    - name: Normalize docker_services
      set_fact:
        _docker_services: "{{ docker_services | from_json if docker_services is string else docker_services }}"

    # Parse mounts list into a dictionary for easier access in templates
    # resulting format looks like this:
    #    service_mounts:
    #      configs: "/appdata"
    #      cloud: "/storage/cloud"
    # Meaning that, e.g., config can be accessed as `service_mounts.config`
    # Only mounts with a 'name' attribute are included in the dictionary
    # Supports both JSON string and native list formats
    - name: Parse and flatten mounts
      set_fact:
        service_mounts: >-
          {%- if mounts is defined and mounts != '' -%}
            {%- set result = {} -%}
            {%- if mounts is string -%}
              {%- set mounts_list = mounts | from_json -%}
            {%- else -%}
              {%- set mounts_list = mounts -%}
            {%- endif -%}
            {%- for mount in mounts_list -%}
              {%- if mount.name is defined -%}
                {%- set _ = result.update({mount.name: mount.path}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ result }}
          {%- else -%}
            {}
          {%- endif -%}

    # Parse devices list into a dictionary for easier access in templates,
    # mirroring service_mounts. Resulting format:
    #    service_devices:
    #      zigbee: "/dev/serial/by-id/usb-..."
    # Only devices with a 'name' attribute are included
    - name: Parse and flatten devices
      set_fact:
        service_devices: >-
          {%- if devices is defined and devices != '' -%}
            {%- set result = {} -%}
            {%- if devices is string -%}
              {%- set devices_list = devices | from_json -%}
            {%- else -%}
              {%- set devices_list = devices -%}
            {%- endif -%}
            {%- for dev in devices_list -%}
              {%- if dev.name is defined -%}
                {%- set _ = result.update({dev.name: dev.path}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ result }}
          {%- else -%}
            {}
          {%- endif -%}

    - name: Check for additional tasks file
      stat:
        path: "{{ role_path }}/tasks/additional/{{ item.name }}.yaml"
      register: additional_tasks_check
      loop: "{{ _docker_services }}"
      delegate_to: localhost

    - name: Execute pre-deployment tasks
      include_tasks: "{{ role_path }}/tasks/additional/{{ item.item.name }}.yaml"
      vars:
        task_phase: "pre"
      when: item.stat.exists
      loop: "{{ additional_tasks_check.results }}"
      loop_control:
        loop_var: item

    - name: Ensure /opt/docker dir
      become: true
      file:
        state: directory
        path: /opt/docker/
        mode: "0775"
        owner: root
        group: "{{ docker_group }}"

    - name: Generate docker-compose files
      template:
        src: "{{ item.name }}.yaml.j2"
        dest: "/opt/docker/{{ item.name }}.yaml"
        mode: "0640"
        group: "{{ docker_group }}"
      loop: "{{ _docker_services }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Generate main docker-compose.yaml with includes
      template:
        src: "{{ item }}.j2"
        dest: "/opt/docker/{{ item }}"
        mode: "0640"
        group: "{{ docker_group }}"
      loop:
        - "docker-compose.yaml"
        - "common.yaml"
      when: docker_services is defined and docker_services != ''

    - name: Execute post-deployment tasks
      include_tasks: "{{ role_path }}/tasks/additional/{{ item.item.name }}.yaml"
      vars:
        task_phase: "post"
      when: item.stat.exists
      loop: "{{ additional_tasks_check.results }}"
      loop_control:
        loop_var: item

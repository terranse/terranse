---

- name: Pre-deployment tasks for mosquitto
  when: task_phase == "pre"
  vars:
    additional_tasks_pre: true
  block:
    - name: Ensure mosquitto config directory
      file:
        path: "{{ service_mounts.config }}/mosquitto/config"
        state: directory
        owner: "{{ docker_user }}"
        group: "{{ docker_group }}"
        mode: '0775'

    - name: Ensure mosquitto data directory
      file:
        path: "{{ service_mounts.config }}/mosquitto/data"
        state: directory
        owner: "{{ docker_user }}"
        group: "{{ docker_group }}"
        mode: '0775'

    - name: Ensure mosquitto log directory
      file:
        path: "{{ service_mounts.config }}/mosquitto/log"
        state: directory
        owner: "{{ docker_user }}"
        group: "{{ docker_group }}"
        mode: '0775'

    - name: Write mosquitto broker config
      copy:
        dest: "{{ service_mounts.config }}/mosquitto/config/mosquitto.conf"
        owner: "{{ docker_user }}"
        group: "{{ docker_group }}"
        mode: '0644'
        content: |
          # Anonymous access is acceptable because the broker port is
          # published on the LXC loopback only (see mosquitto.yaml.j2).
          listener 1883
          allow_anonymous true
          persistence true
          persistence_location /mosquitto/data/

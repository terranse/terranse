---

- name: Pre-deployment tasks for fastapi-dls
  when: task_phase == "pre"
  block:
    - name: Create external Docker volume for DLS database
      community.docker.docker_volume:
        name: dls-db
        state: present

    # =========================================================================
    # TLS certificate for the HTTPS licensing endpoint
    #
    # FastAPI-DLS serves the client token and lease API over HTTPS only, and the
    # guest's nvidia-gridd validates the certificate. We mount the publicly
    # trusted *.edholm.cc wildcard (auto-renewed on OPNsense) as webserver.crt /
    # webserver.key so guests trust it with no custom CA — that lets the guest
    # token fetch run WITHOUT --insecure.
    #
    # webserver.crt MUST be the FULL CHAIN (leaf + intermediate). nvidia-gridd /
    # OpenSSL will not fetch a missing intermediate on its own.
    #
    # The separate JWT instance signing keypair (instance.private.pem /
    # instance.public.pem) is auto-generated by the container on first start and
    # persists in this same host-backed cert dir — do NOT delete it, regenerating
    # it invalidates every previously issued client token.
    #
    # Source the cert+key by setting dls_cert_fullchain / dls_cert_key (e.g. from
    # the OPNsense wildcard via 1Password). When unset, the tasks are skipped and
    # the container falls back to its own self-signed cert (guests will NOT trust
    # it) — a warning is emitted so this isn't a silent gap.
    # =========================================================================
    - name: Ensure FastAPI-DLS cert directory exists
      ansible.builtin.file:
        path: /opt/docker/fastapi-dls/cert
        state: directory
        mode: '0750'

    - name: Warn when no wildcard cert is provided for FastAPI-DLS
      ansible.builtin.debug:
        msg: >-
          dls_cert_fullchain / dls_cert_key are not set — FastAPI-DLS will use a
          self-signed cert that vGPU guests will NOT trust. Provide the
          *.edholm.cc wildcard (full chain) to license guests.
      when: dls_cert_fullchain is not defined or dls_cert_key is not defined

    - name: Install FastAPI-DLS webserver certificate (full chain)
      ansible.builtin.copy:
        content: "{{ dls_cert_fullchain }}"
        dest: /opt/docker/fastapi-dls/cert/webserver.crt
        mode: '0644'
      when: dls_cert_fullchain is defined
      notify: Restart docker apps

    - name: Install FastAPI-DLS webserver private key
      ansible.builtin.copy:
        content: "{{ dls_cert_key }}"
        dest: /opt/docker/fastapi-dls/cert/webserver.key
        mode: '0600'
      when: dls_cert_key is defined
      no_log: true
      notify: Restart docker apps

---
- name: Install libvirt and QEMU packages
  become: true
  ansible.builtin.apt:
    name:
      - qemu-system-x86
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - libvirt-dev
      - virtinst
      - dnsmasq-base
      - ebtables
      - ruby-dev
      - build-essential
      - pkg-config
      - libxml2-dev
      - libxslt1-dev
      - zlib1g-dev
    state: present
    update_cache: true

- name: Disable QEMU security driver (required for unprivileged LXC)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/libvirt/qemu.conf
    regexp: '^#?security_driver\s*='
    line: 'security_driver = "none"'
    state: present
  notify: Restart libvirtd

- name: Disable QEMU remember_owner (required for unprivileged LXC)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/libvirt/qemu.conf
    regexp: '^#?remember_owner\s*='
    line: 'remember_owner = 0'
    state: present
  notify: Restart libvirtd

- name: Enable and start libvirtd
  become: true
  ansible.builtin.service:
    name: libvirtd
    enabled: true
    state: started

- name: Check if default network is active
  become: true
  command: virsh net-info default
  register: virsh_net_info
  failed_when: false
  changed_when: false

- name: Activate default NAT network
  become: true
  command: virsh net-start default
  when: "'Active:         yes' not in virsh_net_info.stdout"
  changed_when: true

- name: Autostart default NAT network
  become: true
  command: virsh net-autostart default
  when: "'Autostart:      yes' not in virsh_net_info.stdout"
  changed_when: true

---
# Handlers for gaming role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart sunshine
  # Sunshine is a user service in the gamer session; restart it in user scope.
  become: true
  become_user: "{{ gaming_user }}"
  ansible.builtin.systemd:
    name: sunshine
    scope: user
    state: restarted
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[gaming_user][1] | default(1000) }}"
  failed_when: false

# Restarting the whole user manager, not just sway: a new supplementary group (video,
# input) only takes effect when the manager itself is re-execed, and sway needs those
# groups to reach the seat. This tears down the streaming session, so it is a handler —
# it fires only when something actually changed.
- name: Restart gaming session
  ansible.builtin.systemd:
    name: "user@{{ getent_passwd[gaming_user][1] | default(1001) }}.service"
    state: restarted
  failed_when: false

- name: Restart lightdm
  ansible.builtin.systemd:
    name: lightdm
    state: restarted
  failed_when: false

- name: Restart display manager
  ansible.builtin.systemd:
    name: display-manager
    state: restarted
  failed_when: false

- name: Reboot for NVIDIA driver
  ansible.builtin.debug:
    msg: |
      NVIDIA driver installed. A reboot is recommended.
      Run: sudo reboot

- name: Restart nvidia-gridd
  ansible.builtin.systemd:
    name: nvidia-gridd
    state: restarted
  failed_when: false

- name: Restart game-sync
  ansible.builtin.systemd:
    name: game-sync
    state: restarted
  failed_when: false

---
# Handlers for gaming role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart sunshine
  ansible.builtin.systemd:
    name: sunshine
    state: restarted

- name: Restart lightdm
  ansible.builtin.systemd:
    name: lightdm
    state: restarted
  failed_when: false

- name: Restart display manager
  ansible.builtin.systemd:
    name: display-manager
    state: restarted
  failed_when: false

- name: Reboot for NVIDIA driver
  ansible.builtin.debug:
    msg: |
      NVIDIA driver installed. A reboot is recommended.
      Run: sudo reboot

- name: Restart nvidia-gridd
  ansible.builtin.systemd:
    name: nvidia-gridd
    state: restarted
  failed_when: false

- name: Restart game-sync
  ansible.builtin.systemd:
    name: game-sync
    state: restarted
  failed_when: false

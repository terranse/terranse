---
# Game Storage Mount Configuration
#
# Mounts shared game storage via virtiofs (preferred, from host ZFS pools)
# or NFS (fallback, from NAS). Virtiofs is tried first; NFS is used only
# when virtiofs is not available and nfs_server is defined.

- name: Install NFS client
  ansible.builtin.apt:
    name:
      - nfs-common
    state: present

# Create mount points
- name: Create game storage mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/games
    - /mnt/games/pc
    - /mnt/games/emulation
    - /mnt/sunshine-creds
    - /mnt/gaming/session-state
    - /mnt/games/covers

# =============================================================================
# Virtiofs mounts (preferred — shared from host ZFS pools)
# =============================================================================
# Driven by the VM's `mounts` list (tofu passes it through the inventory), so a
# new share is declared in one place rather than hardcoded here. The host play
# publishes each as a directory mapping and attaches it; the virtiofs tag is the
# mapping id.
- name: Create mount points for the declared virtiofs shares
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0755'
  loop: "{{ vm_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount the declared virtiofs shares
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "{{ item.name }}"
    fstype: virtiofs
    state: mounted
  loop: "{{ vm_mounts }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.path }}"
  register: _virtiofs_mounts
  # A share attached while the VM was running is invisible to the guest until it
  # restarts, so a first run after attaching legitimately cannot mount. Do not
  # fail the play for that — but do not pretend it worked either (see below).
  failed_when: false

- name: Report virtiofs shares that could not be mounted
  ansible.builtin.debug:
    msg: >-
      Could not mount {{ _virtiofs_mounts.results | rejectattr('failed', 'equalto', false)
                         | map(attribute='item.name') | join(', ') }}.
      A share attached to a running VM is only visible after it restarts — reboot
      the VM and re-run. If it persists, the host has not published the mapping.
  when: _virtiofs_mounts.results | default([]) | rejectattr('failed', 'equalto', false) | list | length > 0

# =============================================================================
# NFS fallback (from NAS, when virtiofs is not available)
# =============================================================================
- name: Mount shared game storage from NFS (Steam/GOG)
  ansible.posix.mount:
    path: /mnt/games/pc
    src: "{{ nfs_server }}:/tank/gaming/games/steam"
    fstype: nfs
    opts: "rw,noatime,nfsvers=4.2,soft,timeo=150,retrans=3"
    state: mounted
  when:
    - nfs_server is defined
    - virtiofs_pc_games is failed

- name: Mount emulation from NFS
  ansible.posix.mount:
    path: /mnt/games/emulation
    src: "{{ nfs_server }}:/tank/gaming/emulation"
    fstype: nfs
    opts: "rw,noatime,nfsvers=4.2"
    state: mounted
  when:
    - nfs_server is defined
    - virtiofs_emulation is failed

# Mount emulation ROMs (read-only, NFS only)
- name: Mount emulation ROMs (read-only)
  ansible.posix.mount:
    path: /mnt/games/emulation/roms
    src: "{{ nfs_server }}:/tank/gaming/emulation/roms"
    fstype: nfs
    opts: "ro,noatime,nfsvers=4.2"
    state: mounted
  when:
    - nfs_server is defined
    - virtiofs_emulation is failed

# Mount user-specific emulation saves (read-write, NFS only)
- name: Mount user emulation saves
  ansible.posix.mount:
    path: /mnt/games/emulation/users
    src: "{{ nfs_server }}:/tank/gaming/emulation/users"
    fstype: nfs
    opts: "rw,noatime,nfsvers=4.2"
    state: mounted
  when:
    - nfs_server is defined
    - virtiofs_emulation is failed

# =============================================================================
# Shared credentials and session state (NFS only — these don't need virtiofs)
# =============================================================================
- name: Mount Sunshine credentials
  ansible.posix.mount:
    path: /mnt/sunshine-creds
    src: "{{ nfs_server }}:/tank/gaming/sunshine-credentials"
    fstype: nfs
    opts: "ro,noatime,nfsvers=4.2"
    state: mounted
  when: nfs_server is defined

- name: Mount session state directory
  ansible.posix.mount:
    path: /mnt/gaming/session-state
    src: "{{ nfs_server }}:/tank/gaming/session-state"
    fstype: nfs
    opts: "rw,noatime,nfsvers=4.2,async"
    state: mounted
  when: nfs_server is defined

- name: Mount shared cover art cache
  ansible.posix.mount:
    path: /mnt/games/covers
    src: "{{ nfs_server }}:/tank/gaming/covers"
    fstype: nfs
    opts: "rw,noatime,nfsvers=4.2"
    state: mounted
  when: nfs_server is defined

# Create user-specific game directory for ZFS clones
- name: Create user game directory
  ansible.builtin.file:
    path: "/mnt/games/emulation/users/{{ gaming_user }}"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'
  when: nfs_server is defined

- name: Display storage mount info
  ansible.builtin.debug:
    msg: |
      ========================================
      Game Storage Configuration:

      virtiofs shares (from the VM's declared `mounts`):
      {% for m in vm_mounts %}
        {{ m.name }} -> {{ m.path }}
      {% endfor %}
      Sunshine creds:  /mnt/sunshine-creds
      Session state:   /mnt/gaming/session-state (GPU manager)
      Cover art:       /mnt/games/covers

      NFS Server: {{ nfs_server | default('Not configured — using virtiofs') }}
      ========================================

---
# Steam Installation and Configuration
#
# Installs Steam with Proton for Linux gaming

# Sunshine cannot hardcode the launch command: apt is preferred and Flatpak is
# only a fallback, so which Steam exists is not known until the install below
# has run. Launch through a script that picks whichever is actually present.
- name: Deploy the Steam launcher Sunshine calls
  ansible.builtin.template:
    src: launch-steam.sh.j2
    dest: /opt/sunshine/launch-steam.sh
    mode: '0755'

# Flatpak first, deliberately. Ubuntu's `steam-installer` is only a bootstrapper:
# on first launch it downloads the real client and wants a licence accepted, which
# on a headless guest wedged into several stuck processes drawing no window at all
# — the session streamed a black screen with nothing in any log to explain it.
# The Flatpak ships a complete, self-contained client with its own runtime, needs
# no i386 host libraries, and is what Lutris and RetroArch already use here.
- name: Add Flathub repository
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    state: present

- name: Install Steam via Flatpak
  community.general.flatpak:
    name: com.valvesoftware.Steam
    state: present
  failed_when: false
  register: steam_flatpak_install

# The Flatpak sandbox blocks both of these by default, and each failure is silent
# and looks like something else entirely.
#
# Without the filesystem grant Steam cannot see /mnt/games at all, so it installs
# games onto the VM's small root disk instead of the multi-terabyte pool.
#
# Without the system-bus grant Steam cannot ask NetworkManager whether the box is
# online, so `-steamos` mode reports "no network" on a guest with a perfectly good
# connection — and the SteamOS first-run wizard refuses to go past its network step.
- name: Let Steam reach game storage and NetworkManager from inside its sandbox
  ansible.builtin.command:
    cmd: >-
      flatpak override
      --filesystem={{ game_storage_root | default('/mnt/games') }}
      --system-talk-name=org.freedesktop.NetworkManager
      com.valvesoftware.Steam
  become: true
  changed_when: false
  when: steam_flatpak_install is not failed

# Fall back to apt only when Flatpak is unavailable.
- name: Enable i386 architecture for Steam (apt fallback)
  ansible.builtin.command: dpkg --add-architecture i386
  changed_when: false
  when: steam_flatpak_install is failed

- name: Update apt cache after adding i386 (apt fallback)
  ansible.builtin.apt:
    update_cache: true
  when: steam_flatpak_install is failed

- name: Install Steam via apt (fallback)
  ansible.builtin.apt:
    name:
      - steam-installer
      - steam-devices
      - libgl1-mesa-dri:i386
      - libgl1:i386
      - libc6:i386
    state: present
  when: steam_flatpak_install is failed

# Configure Steam library paths
- name: Create Steam library directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'
  loop:
    - "/home/{{ gaming_user }}/.steam"
    - "/home/{{ gaming_user }}/.local/share/Steam"

# Link to shared game storage if available
- name: Check if shared game storage is mounted
  ansible.builtin.stat:
    path: /mnt/games/steam
  register: steam_share

- name: Create symlink to shared Steam library
  ansible.builtin.file:
    src: /mnt/games/steam
    dest: "/home/{{ gaming_user }}/.local/share/Steam/steamapps"
    state: link
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    force: true
  when: steam_share.stat.exists | default(false)

# Register the game pool as a Steam library.
#
# Steam's Big Picture "add drive" button silently does nothing for a path it does
# not already consider a library, and Steam ships no CLI for this — so without
# this the games quietly install onto the VM's 64 GB root disk instead of the
# multi-terabyte pool, on every rebuild.
- name: Look up the gaming user uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ gaming_user }}"

- name: Install the Steam library registration helper
  ansible.builtin.copy:
    src: register-steam-library.py
    dest: /opt/gaming/register-steam-library.py
    mode: '0755'

- name: Check whether the game pool is already a Steam library
  ansible.builtin.command:
    cmd: grep -q '"path".*"{{ steam_library_path }}"' {{ _steam_libraryfolders }}
  register: _steam_lib_registered
  changed_when: false
  failed_when: false

# Steam rewrites libraryfolders.vdf when it exits, so an edit made underneath a
# running client is simply discarded.
- name: Stop Steam before registering the library
  ansible.builtin.command: pkill -u {{ gaming_user }} -f valvesoftware
  changed_when: false
  failed_when: false
  when: _steam_lib_registered.rc != 0

- name: Register the game pool as a Steam library
  ansible.builtin.command:
    cmd: >-
      python3 /opt/gaming/register-steam-library.py
      --steam-root {{ _steam_root }}
      --library {{ steam_library_path }}
      --uid {{ getent_passwd[gaming_user][1] | default(1001) }}
  register: _steam_lib_register
  changed_when: "'already registered' not in _steam_lib_register.stdout"
  when: _steam_lib_registered.rc != 0

# Wine prefixes live on the game pool, and that is deliberate: they hold the EA/Ubisoft
# account logins and the saves of any title without Steam Cloud, so they must outlive a
# VM rebuild. Steam already puts a prefix inside the library the game lives in, so this
# needs no configuration here — it needs the SHARE to support extended attributes,
# which is set up in the gpu-manager role (ZFS xattr=sa + virtiofs expose-xattr=1).
# Without that, Wine cannot write file attributes, msiexec dies, and the EA App
# installer fails at 99% with INST-14-1603. Do not "fix" that by moving prefixes to the
# guest's local disk: it works, and it silently throws the logins away on every rebuild.

# Install Proton-GE for better compatibility.
#
# It MUST land under the Steam we actually run. This used to install into
# ~/.steam/root/compatibilitytools.d — the apt Steam's path — while the role prefers
# the Flatpak, which only ever reads
# ~/.var/app/com.valvesoftware.Steam/.local/share/Steam/compatibilitytools.d. Steam
# does not warn about a compat tool it cannot see, so Proton-GE was downloaded and
# unpacked correctly on every run and was invisible to Steam every time. Games
# silently fell back to stock Proton — which is exactly the configuration in which the
# EA App installer dies with INST-14-1603. Use _steam_root, as the library
# registration above already does.
- name: Create Proton-GE directory
  ansible.builtin.file:
    path: "{{ _steam_root }}/compatibilitytools.d"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'

- name: Get latest Proton-GE release
  ansible.builtin.uri:
    url: https://api.github.com/repos/GloriousEggroll/proton-ge-custom/releases/latest
    return_content: true
  register: proton_ge_release
  changed_when: false

- name: Extract Proton-GE version
  ansible.builtin.set_fact:
    proton_ge_version: "{{ proton_ge_release.json.tag_name }}"
    # Match the tarball for THIS release exactly ("GE-Proton11-1.tar.gz"). Taking
    # the first `*.tar.gz` asset grabbed "GE-Proton11-1-aarch64.tar.gz" — an ARM64
    # Proton, installed on an x86_64 guest, every time.
    proton_ge_url: >-
      {{ proton_ge_release.json.assets
         | selectattr('name', 'equalto', proton_ge_release.json.tag_name ~ '.tar.gz')
         | map(attribute='browser_download_url') | first }}

- name: Check if Proton-GE is installed
  ansible.builtin.stat:
    path: "{{ _steam_root }}/compatibilitytools.d/{{ proton_ge_version }}"
  register: proton_ge_installed

- name: Download Proton-GE
  ansible.builtin.get_url:
    url: "{{ proton_ge_url }}"
    dest: "/tmp/proton-ge.tar.gz"
    mode: '0644'
  when: not proton_ge_installed.stat.exists | default(false)

- name: Extract Proton-GE
  ansible.builtin.unarchive:
    src: /tmp/proton-ge.tar.gz
    dest: "{{ _steam_root }}/compatibilitytools.d/"
    remote_src: true
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
  when: not proton_ge_installed.stat.exists | default(false)

- name: Clean up Proton-GE download
  ansible.builtin.file:
    path: /tmp/proton-ge.tar.gz
    state: absent

# -----------------------------------------------------------------------------
# Per-game DXVK tuning.
#
# DXVK looks for `dxvk.conf` in the process working directory, and Steam sets that
# to the game's install dir — so dropping a file next to the exe needs no launch
# option, no env var, and no Steam restart. That matters because the alternative
# (a LaunchOptions entry in localconfig.vdf) can only be written with Steam shut
# down, or it gets overwritten when Steam next flushes its config.
#
# Only applied when the shared library is actually mounted; the install dirs live
# on the virtiofs game pool, not on the VM's own disk.
# -----------------------------------------------------------------------------
- name: Check which DXVK-tuned games are installed
  ansible.builtin.stat:
    path: "{{ steam_library_path }}/steamapps/common/{{ item.key }}"
  register: _dxvk_game_dirs
  loop: "{{ steam_game_dxvk_conf | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - game_storage_mount | bool
    - steam_game_dxvk_conf | length > 0

# Skipped silently for games that are not installed — the tuned list is a
# superset of whatever happens to be on the pool at any given moment.
- name: Apply per-game DXVK configuration
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (gaming role, steam.yaml) - do not edit manually.
      {{ item.item.value.comment | default('') }}
      {% for k, v in item.item.value.options.items() %}
      {{ k }} = {{ v }}
      {% endfor %}
    dest: "{{ steam_library_path }}/steamapps/common/{{ item.item.key }}/dxvk.conf"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'
  loop: "{{ _dxvk_game_dirs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('skipped') }}"
  when: item.stat.exists | default(false)

- name: Display Steam setup info
  ansible.builtin.debug:
    msg: |
      ========================================
      Steam Setup Complete!

      Proton-GE version: {{ proton_ge_version }}

      To launch Steam in Big Picture mode:
        flatpak run com.valvesoftware.Steam -bigpicture

      Or use the Sunshine app shortcut.
      ========================================

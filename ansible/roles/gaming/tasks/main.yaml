---
# Gaming VM Configuration Role
#
# This role configures a VM for cloud gaming with:
# - GPU guest drivers (NVIDIA vGPU or Intel)
# - Wayland compositor (gamescope/cage/sway) with virtual display
# - Sunshine streaming server
# - Steam with Proton
# - RetroArch emulators (optional)
# - Shared game storage via NFS
# - Boot snapshot hooks for instant resume
#
# Required variables:
#   gpu_type: "nvidia_vgpu" | "intel_sriov" | "none"
#
# Optional variables:
#   wayland_compositor: "gamescope" | "cage" | "sway" (default: gamescope)
#   virtual_display_width: 1920
#   virtual_display_height: 1080
#   virtual_display_refresh: 60
#   sunshine_enabled: true
#   steam_enabled: true
#   retroarch_enabled: false
#   game_storage_mount: true
#   snapshot_on_boot: true
#   gaming_user: "gamer"
#   nfs_server: IP of NAS with game storage

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - gpu_type is defined
      - gpu_type in ['nvidia_vgpu', 'intel_sriov', 'none']
    fail_msg: "gpu_type must be defined and be one of: nvidia_vgpu, intel_sriov, none"

- name: Set default variables
  ansible.builtin.set_fact:
    gaming_user: "{{ gaming_user | default('gamer') }}"
    wayland_compositor: "{{ wayland_compositor | default('gamescope') }}"
    virtual_display_width: "{{ virtual_display_width | default(1920) }}"
    virtual_display_height: "{{ virtual_display_height | default(1080) }}"
    virtual_display_refresh: "{{ virtual_display_refresh | default(60) }}"
    sunshine_enabled: "{{ sunshine_enabled | default(true) }}"
    steam_enabled: "{{ steam_enabled | default(true) }}"
    retroarch_enabled: "{{ retroarch_enabled | default(false) }}"
    game_storage_mount: "{{ game_storage_mount | default(true) }}"
    snapshot_on_boot: "{{ snapshot_on_boot | default(true) }}"
    # Wayland only - no X11 fallback
    display_server: "wayland"

# =============================================================================
# Base system setup
# =============================================================================
- name: Install base gaming packages
  ansible.builtin.apt:
    name:
      - mesa-utils
      - vainfo
      - curl
      - wget
      - git
      - htop
      - qemu-guest-agent
      - flatpak
    state: present
    update_cache: true

# Wayland display stack
- name: Install Wayland packages
  ansible.builtin.apt:
    name:
      - pipewire
      - pipewire-pulse
      - pipewire-alsa
      - wireplumber
      - libdrm2
      - xwayland  # For X11 game compatibility only
    state: present

- name: Ensure gaming user exists
  ansible.builtin.user:
    name: "{{ gaming_user }}"
    shell: /bin/bash
    groups: audio,video,input,render
    append: true
    create_home: true

- name: Enable qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

# =============================================================================
# GPU driver setup (guest side)
# =============================================================================
- name: Include NVIDIA vGPU guest driver setup
  ansible.builtin.include_tasks: nvidia-guest.yaml
  when: gpu_type == "nvidia_vgpu"

- name: Include Intel graphics driver setup
  ansible.builtin.include_tasks: intel-guest.yaml
  when: gpu_type == "intel_sriov"

# =============================================================================
# Wayland compositor setup (virtual display)
# =============================================================================
- name: Setup Wayland virtual display
  ansible.builtin.include_tasks: wayland-display.yaml

# =============================================================================
# Game storage (NFS)
# =============================================================================
- name: Mount shared game storage
  ansible.builtin.include_tasks: game-storage.yaml
  when: game_storage_mount | bool

# =============================================================================
# Streaming and gaming applications
# =============================================================================
- name: Setup Sunshine streaming server
  ansible.builtin.include_tasks: sunshine.yaml
  when: sunshine_enabled | bool

- name: Install Steam with Proton
  ansible.builtin.include_tasks: steam.yaml
  when: steam_enabled | bool

- name: Setup RetroArch emulators
  ansible.builtin.include_tasks: retroarch.yaml
  when: retroarch_enabled | bool

# =============================================================================
# Snapshot hooks for instant resume
# =============================================================================
- name: Configure boot snapshot hooks
  ansible.builtin.include_tasks: snapshots.yaml
  when: snapshot_on_boot | bool

# =============================================================================
# Final setup
# =============================================================================
- name: Enable auto-login for gaming user
  ansible.builtin.template:
    src: lightdm-autologin.conf.j2
    dest: /etc/lightdm/lightdm.conf.d/50-autologin.conf
    mode: '0644'
  notify: Restart lightdm

- name: Display setup completion message
  ansible.builtin.debug:
    msg: |
      ========================================
      Gaming VM Setup Complete!

      GPU Type: {{ gpu_type }}
      Display: Wayland ({{ wayland_compositor }})
      Resolution: {{ virtual_display_width }}x{{ virtual_display_height }}@{{ virtual_display_refresh }}Hz
      Sunshine: {{ sunshine_enabled }}
      Steam: {{ steam_enabled }}
      RetroArch: {{ retroarch_enabled }}

      Connect via Moonlight to start gaming!
      ========================================

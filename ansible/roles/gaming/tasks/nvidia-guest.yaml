---
# NVIDIA vGPU Guest Driver Installation
#
# Installs the NVIDIA vGPU guest driver inside the VM.
# Drivers are shared from the Proxmox host via virtiofs.
#
# Required variables:
#   dls_server_ip: IP of FastAPI-DLS server
#
# Optional variables:
#   nvidia_guest_driver_url: Direct URL fallback if virtiofs not available
#   nvidia_guest_install_deb: Use .deb package instead of .run (default: false)

- name: Check if NVIDIA driver is already installed
  ansible.builtin.command: nvidia-smi
  register: nvidia_check
  changed_when: false
  failed_when: false

- name: Install NVIDIA driver prerequisites
  ansible.builtin.apt:
    name:
      - build-essential
      - dkms
      - "linux-headers-{{ ansible_kernel }}"
    state: present
  when: nvidia_check.rc != 0

# =============================================================================
# Find guest driver (virtiofs mount from host)
# =============================================================================
- name: Check if virtiofs driver share is mounted
  ansible.builtin.stat:
    path: /mnt/drivers/linux
  register: virtiofs_mount

- name: Create virtiofs mount point
  ansible.builtin.file:
    path: /mnt/drivers
    state: directory
    mode: '0755'
  when: not virtiofs_mount.stat.exists | default(true)

- name: Mount virtiofs driver share
  ansible.builtin.mount:
    path: /mnt/drivers
    src: nvidia-guest-drivers
    fstype: virtiofs
    opts: ro
    state: mounted
  when: not virtiofs_mount.stat.exists | default(true)
  failed_when: false
  register: virtiofs_mounted

# =============================================================================
# Install guest driver
# =============================================================================
- name: Find NVIDIA guest driver (.deb)
  ansible.builtin.find:
    paths: /mnt/drivers/linux
    patterns: "nvidia-linux-grid-*_amd64.deb"
    recurse: false
  register: deb_driver
  when:
    - nvidia_check.rc != 0
    - nvidia_guest_install_deb | default(false)

- name: Find NVIDIA guest driver (.run)
  ansible.builtin.find:
    paths: /mnt/drivers/linux
    patterns: "NVIDIA-Linux-x86_64-*-grid.run"
    recurse: false
  register: run_driver
  when:
    - nvidia_check.rc != 0
    - not (nvidia_guest_install_deb | default(false))

- name: Install NVIDIA guest driver from .deb
  ansible.builtin.apt:
    deb: "{{ deb_driver.files[0].path }}"
    state: present
  when:
    - nvidia_check.rc != 0
    - nvidia_guest_install_deb | default(false)
    - deb_driver.matched | default(0) > 0
  notify: Reboot for NVIDIA driver

- name: Install NVIDIA guest driver from .run
  # Invoke via `sh` rather than executing directly: the driver lives on a
  # read-only virtiofs share without the execute bit, so exec'ing the path
  # fails with EACCES. The .run is a makeself shell archive, so `sh <file>`
  # runs it without needing +x or an exec-capable mount.
  ansible.builtin.command:
    cmd: "sh {{ run_driver.files[0].path }} --dkms --silent"
  when:
    - nvidia_check.rc != 0
    - not (nvidia_guest_install_deb | default(false))
    - run_driver.matched | default(0) > 0
  notify: Reboot for NVIDIA driver

# =============================================================================
# Fallback: download driver directly if virtiofs not available
# =============================================================================
- name: Download NVIDIA guest driver (fallback)
  ansible.builtin.get_url:
    url: "{{ nvidia_guest_driver_url }}"
    dest: /tmp/nvidia-driver.run
    mode: '0755'
  when:
    - nvidia_check.rc != 0
    - virtiofs_mounted is failed or (run_driver.matched | default(0) == 0 and deb_driver.matched | default(0) == 0)
    - nvidia_guest_driver_url is defined

- name: Install NVIDIA guest driver (fallback)
  ansible.builtin.command:
    cmd: /tmp/nvidia-driver.run --dkms --silent
  when:
    - nvidia_check.rc != 0
    - virtiofs_mounted is failed or (run_driver.matched | default(0) == 0 and deb_driver.matched | default(0) == 0)
    - nvidia_guest_driver_url is defined
  notify: Reboot for NVIDIA driver

# =============================================================================
# Configure licensing
#
# vGPU licensing is unforgiving: the guest must (1) point gridd at a reachable
# DLS server with the right FeatureType, (2) have a clock within 10 minutes of
# the DLS server (NVIDIA bug 3859889) on the same timezone, and (3) fetch a
# fresh client token and restart nvidia-gridd within ~1 hour of generating it.
# We therefore sync time first, then fetch the token and restart gridd as one
# step so the registration window is never blown.
# =============================================================================
- name: Ensure time sync is installed and active (vGPU licensing prerequisite)
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present

- name: Enable and start systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Set guest timezone to match the DLS server
  community.general.timezone:
    name: "{{ dls_timezone | default('Europe/Stockholm') }}"

- name: Verify the clock is synchronized (fail loudly if not)
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: ntp_synced
  changed_when: false
  retries: 6
  delay: 10
  until: ntp_synced.stdout | trim == "yes"
  failed_when: ntp_synced.stdout | trim != "yes"

- name: Ensure NVIDIA config directory exists
  ansible.builtin.file:
    path: /etc/nvidia
    state: directory
    mode: '0755'

- name: Configure FastAPI-DLS licensing
  ansible.builtin.template:
    src: gridd-guest.conf.j2
    dest: /etc/nvidia/gridd.conf
    mode: '0644'
  when: dls_server_ip is defined

# =============================================================================
# Fetch the client config token and (re)license
#
# Done in a block so a fresh token is fetched and nvidia-gridd restarted in the
# same run. The token endpoint is /-/client-token (note the /-/). We keep exactly
# ONE token in the dir (clear stale ones) and download straight to disk — the
# token contains special characters and must never be copy/pasted. With the
# publicly trusted wildcard cert there is no --insecure.
# =============================================================================
- name: Fetch vGPU client config token and license the guest
  when: dls_server_ip is defined
  block:
    - name: Ensure ClientConfigToken directory exists
      ansible.builtin.file:
        path: /etc/nvidia/ClientConfigToken
        state: directory
        mode: '0755'

    - name: Remove stale client config tokens
      ansible.builtin.find:
        paths: /etc/nvidia/ClientConfigToken
        patterns: "*.tok"
      register: stale_tokens

    - name: Delete stale client config tokens
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_tokens.files }}"

    - name: Download client config token from FastAPI-DLS
      ansible.builtin.get_url:
        url: "https://{{ dls_server_ip }}/-/client-token"
        dest: "/etc/nvidia/ClientConfigToken/client_configuration_token_{{ ansible_date_time.iso8601_basic_short }}.tok"
        mode: '0644'
        # Public wildcard cert is trusted — validate it (no insecure fallback).
        validate_certs: true

    - name: Restart nvidia-gridd to register the new token
      ansible.builtin.systemd:
        name: nvidia-gridd
        state: restarted
      failed_when: false

    - name: Verify the guest is licensed
      ansible.builtin.command: nvidia-smi -q
      register: nvidia_license
      changed_when: false
      failed_when: false
      retries: 6
      delay: 10
      until: "'Licensed' in (nvidia_license.stdout | default('')) and 'Unlicensed' not in (nvidia_license.stdout | default(''))"

    - name: Report licensing status
      ansible.builtin.debug:
        msg: >-
          {{ 'vGPU Licensed' if ('Licensed' in (nvidia_license.stdout | default('')) and 'Unlicensed' not in (nvidia_license.stdout | default('')))
             else 'vGPU still Unlicensed — check DLS reachability, FeatureType, clock skew and cert trust' }}

- name: Enable nvidia-persistenced
  ansible.builtin.systemd:
    name: nvidia-persistenced
    enabled: true
    state: started
  failed_when: false

- name: Verify NVIDIA driver installation
  ansible.builtin.command: nvidia-smi
  register: nvidia_verify
  changed_when: false
  failed_when: false

- name: Display NVIDIA driver status
  ansible.builtin.debug:
    msg: |
      NVIDIA Driver Status:
      {{ nvidia_verify.stdout | default('Not installed or not loaded - reboot may be required') }}

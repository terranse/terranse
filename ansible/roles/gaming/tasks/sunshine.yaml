---
# Sunshine Streaming Server Setup
#
# Installs and configures Sunshine for game streaming via Moonlight

- name: Install Sunshine dependencies
  ansible.builtin.apt:
    name:
      - libavcodec-dev
      - libdrm-dev
      - libevdev-dev
      - libpulse-dev
      - libx11-dev
      - libxfixes-dev
      - libxrandr-dev
      - libxtst-dev
      - libcap2-bin
      - libssl-dev
      - libcurl4-openssl-dev
      - libopus-dev
      - libboost-all-dev
      - cmake
      - g++
    state: present

# Install Sunshine from package or AppImage
- name: Check if Sunshine is installed
  ansible.builtin.command: which sunshine
  register: sunshine_installed
  changed_when: false
  failed_when: false

- name: Create Sunshine directory
  ansible.builtin.file:
    path: /opt/sunshine
    state: directory
    mode: '0755'

- name: Download Sunshine package matching the guest OS
  # Use the .deb built for this exact Ubuntu release so apt can resolve its
  # dependencies (the generic debian-bookworm build depends on libmfx1, which
  # no longer exists on Ubuntu 26.04).
  ansible.builtin.get_url:
    url: "https://github.com/LizardByte/Sunshine/releases/download/{{ sunshine_version }}/sunshine-ubuntu-{{ ansible_distribution_version }}-amd64.deb"
    dest: /tmp/sunshine.deb
    mode: '0644'
    force: true # always fetch the OS-matched build; never reuse a stale download
  when: sunshine_installed.rc != 0

- name: Install Sunshine package
  ansible.builtin.apt:
    deb: /tmp/sunshine.deb
    state: present
  when: sunshine_installed.rc != 0

- name: Clean up Sunshine download
  ansible.builtin.file:
    path: /tmp/sunshine.deb
    state: absent

# Configure Sunshine
- name: Create Sunshine config directory
  ansible.builtin.file:
    path: "/home/{{ gaming_user }}/.config/sunshine"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'

# Session hooks for GPU management
- name: Create Sunshine hooks directory
  ansible.builtin.file:
    path: /opt/sunshine/hooks
    state: directory
    mode: '0755'

- name: Deploy session start hook
  ansible.builtin.template:
    src: sunshine-session-start.sh.j2
    dest: /opt/sunshine/hooks/session-start.sh
    mode: '0755'

- name: Deploy session stop hook
  ansible.builtin.template:
    src: sunshine-session-stop.sh.j2
    dest: /opt/sunshine/hooks/session-stop.sh
    mode: '0755'

- name: Deploy Sunshine configuration
  ansible.builtin.template:
    src: sunshine.conf.j2
    dest: "/home/{{ gaming_user }}/.config/sunshine/sunshine.conf"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'
  notify: Restart sunshine

- name: Deploy Sunshine apps configuration
  ansible.builtin.template:
    src: sunshine-apps.json.j2
    dest: "/home/{{ gaming_user }}/.config/sunshine/apps.json"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'
  notify: Restart sunshine

# Mount shared credentials from NFS (if available)
- name: Check if shared credentials mount exists
  ansible.builtin.stat:
    path: /mnt/sunshine-creds
  register: creds_mount

- name: Create credentials symlink
  ansible.builtin.file:
    src: /mnt/sunshine-creds
    dest: "/home/{{ gaming_user }}/.config/sunshine/credentials"
    state: link
    force: true
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
  # Optional NFS credential sharing — never block the deploy if the dest already
  # exists as a real directory (no NFS share present on this VM).
  when: creds_mount.stat.exists | default(false)
  failed_when: false

# Web UI credentials. Home Player needs these to submit pairing PINs to
# /api/pin on the operator's behalf, which is what makes Moonlight pairing
# hands-free. Both sides read the same 1Password item, so the password never has
# to be typed or copied anywhere.
# Sunshine hashes the password (with a random salt) into sunshine_state.json, so
# the desired value cannot be compared against what is stored, and re-running
# `sunshine --creds` would rewrite the file every time and restart the server —
# killing any live stream. Nor is "is a username set?" a usable proxy: Sunshine
# seeds one itself on first run, so that check never fires and the guest is left
# on credentials nobody knows. Ask the server directly whether the credentials we
# intend to use already work, and only reprovision when they do not.
- name: Check whether the intended Sunshine credentials already work
  ansible.builtin.uri:
    url: "https://127.0.0.1:47990/api/config"
    method: GET
    user: "{{ sunshine_web_username }}"
    password: "{{ sunshine_web_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: _sunshine_auth
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - sunshine_web_username | length > 0
    - sunshine_web_password | length > 0

- name: Provision Sunshine web UI credentials from 1Password
  ansible.builtin.command:
    cmd: sunshine --creds {{ sunshine_web_username | quote }} {{ sunshine_web_password | quote }}
  become: true
  become_user: "{{ gaming_user }}"
  when:
    - sunshine_web_username | length > 0
    - sunshine_web_password | length > 0
    - (_sunshine_auth.status | default(0)) != 200 or sunshine_force_creds | bool
  no_log: true
  changed_when: true
  notify: Restart sunshine

# Set capabilities for Sunshine — cap_sys_admin is required for KMS capture and
# lets Sunshine run as an unprivileged user service (no AmbientCapabilities in
# the unit).
#
# cap_sys_nice is meant to let Sunshine prioritise its own work: without any
# priority headroom the capture/encode threads compete with the game at plain
# nice 0 on both the CPU run queue and the GPU context queue. That is invisible
# while a game paces itself to the 60 Hz output, and very visible the moment one
# does not: an uncapped title starves the encoder and the stream picks up
# input-to-photon jitter that reads as steering lag. Capabilities are read at
# exec(), so this only takes effect after Sunshine restarts.
#
# IT IS NOT SUFFICIENT ON ITS OWN, and the "setpriority failed" warnings are NOT
# evidence that this setcap failed. Measured on the running guest 2026-08-05:
# the file carries cap_sys_admin,cap_sys_nice=ep and the process still logs
# "setpriority failed for nice -15: Permission denied" on every stream start,
# with every thread sitting at nice 0. /proc/<pid>/status explains why —
#     CapPrm: cap_sys_nice     CapEff: (empty)
# Sunshine drops its capabilities out of the EFFECTIVE set after start-up (and
# drops cap_sys_admin from Permitted entirely once KMS capture is up), so by the
# time a stream starts and the encoder threads call setpriority(), the capability
# is no longer in force. Nothing we can set on the file changes that.
# The setpriority path is fixed by RLIMIT_NICE instead — see the next task.
- name: Set capabilities for Sunshine
  community.general.capabilities:
    path: /usr/bin/sunshine
    # `=ep`, not `+ep`: getcap reports "cap_sys_admin,cap_sys_nice=ep", and the
    # module compares against that string — so `+ep` never matches and the task
    # reports changed on every single run.
    capability: cap_sys_admin,cap_sys_nice=ep
    state: present
  failed_when: false
  notify: Restart sunshine

# -----------------------------------------------------------------------------
# Priority headroom for the capture/encode threads.
#
# setpriority() lets an unprivileged process go below nice 0 when the target is
# >= (20 - RLIMIT_NICE), no capability required. That is the route that actually
# works here, because Sunshine has dropped cap_sys_nice from its effective set by
# the time it needs it (see the setcap task above).
#
# The limit has to be raised on user@<uid>.service, not on sunshine.service. The
# limit is inherited: systemd ships DefaultLimitNICE=0, so the per-user manager
# gets a HARD limit of 0, and a *user* unit cannot raise its own hard limit — it
# has no CAP_SYS_RESOURCE. Setting LimitNICE in the user-scoped sunshine.service
# would therefore not just fail to help, it would make the unit fail to start.
# user@.service is a system unit, so PID 1 raises it for the whole session and
# Sunshine simply inherits the headroom.
#
# Verified as gamer on the running guest 2026-08-05:
#   systemd-run --uid=1001 ...                     -> setpriority(-15) EPERM
#   systemd-run --uid=1001 -p LimitNICE=-15 ...    -> setpriority(-15) OK, nice -15
#
# -15 matches the most aggressive value Sunshine asks for (it also asks for -10).
# This is inherited by everything in the session, including games — it grants the
# ABILITY to renice, it does not renice anything by itself.
- name: Ensure the user manager drop-in directory exists
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ getent_passwd[gaming_user][1] | default(1001) }}.service.d"
    state: directory
    mode: '0755'

- name: Give the gaming session headroom to raise thread priority
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (gaming role, sunshine.yaml) - do not edit manually.
      # Lets Sunshine's capture/encode threads reach the negative nice values it
      # asks for. See sunshine.yaml for why this cannot live in sunshine.service.
      [Service]
      LimitNICE=-15
    dest: "/etc/systemd/system/user@{{ getent_passwd[gaming_user][1] | default(1001) }}.service.d/10-gaming-nice.conf"
    mode: '0644'
  # rlimits are established when the manager execs, so this only takes hold once
  # the user manager restarts — which tears down the streaming session, hence a
  # handler rather than an inline restart.
  notify:
    - Reload systemd
    - Restart gaming session

# -----------------------------------------------------------------------------
# Input: Sunshine injects the Moonlight client's mouse/keyboard/gamepad via
# /dev/uinput. Without this udev rule it fails with "Could not create Sunshine
# Mouse/Gamepad: Permission denied".
# -----------------------------------------------------------------------------
- name: Ensure uinput module loads at boot
  ansible.builtin.copy:
    content: "uinput\n"
    dest: /etc/modules-load.d/uinput.conf
    mode: '0644'

- name: Load uinput module now
  community.general.modprobe:
    name: uinput
    state: present
  failed_when: false

- name: Install Sunshine uinput udev rule
  ansible.builtin.copy:
    content: |
      KERNEL=="uinput", SUBSYSTEM=="misc", OPTIONS+="static_node=uinput", TAG+="uaccess"
    dest: /etc/udev/rules.d/85-sunshine-input.rules
    mode: '0644'
  register: sunshine_udev

- name: Reload udev rules
  ansible.builtin.command: "{{ item }}"
  loop:
    - udevadm control --reload-rules
    - udevadm trigger
  changed_when: false
  when: sunshine_udev is changed

# An earlier version of this role installed Sunshine as a *system* unit. It has
# no WAYLAND_DISPLAY (it sets DISPLAY=:0), so it never finds the compositor:
# every encoder probe fails and it cannot bind RTSP 48010 because the real,
# session-scoped instance already holds it. Both write the same log file, so the
# healthy instance's web UI ends up reporting the dead one's fatal errors.
# Ansible does not remove units it no longer manages, so retire it explicitly.
- name: Retire the legacy system-scoped Sunshine unit
  ansible.builtin.systemd:
    name: sunshine
    scope: system
    state: stopped
    enabled: false
  failed_when: false

- name: Remove the legacy system-scoped Sunshine unit file
  ansible.builtin.file:
    path: /etc/systemd/system/sunshine.service
    state: absent
  notify: Reload systemd

# -----------------------------------------------------------------------------
# Sunshine runs as a user service in the gamer session (started by Sway). Modern
# Sunshine forces interactive web-UI account creation before pairing, so we seed
# credentials non-interactively here (the stdin `-0` flag is broken upstream).
# -----------------------------------------------------------------------------
- name: Create Sunshine user systemd directory
  ansible.builtin.file:
    path: "/home/{{ gaming_user }}/.config/systemd/user"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'

- name: Create Sunshine user service
  ansible.builtin.template:
    src: sunshine.service.j2
    dest: "/home/{{ gaming_user }}/.config/systemd/user/sunshine.service"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'

# An empty/zero-byte cert from an interrupted earlier run makes Sunshine abort on
# startup ("use_certificate_chain_file: no start line"). Remove empties so the
# creds seed (and Sunshine's first launch) regenerate them cleanly.
- name: Find Sunshine cert files
  ansible.builtin.find:
    paths: "/home/{{ gaming_user }}/.config/sunshine/credentials"
    patterns: "*.pem"
    file_type: file
  register: sunshine_empty_certs
  failed_when: false

- name: Remove empty Sunshine cert files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sunshine_empty_certs.files | default([]) | selectattr('size', 'eq', 0) | list }}"
  loop_control:
    label: "{{ item.path }}"

# Credential seeding lives in "Provision Sunshine web UI credentials from
# 1Password" above, which asks the server whether the intended credentials
# already work and only reprovisions when they do not. This task rewrote them on
# EVERY run (changed_when: true, no guard) — churning the salted hash, reporting
# a change forever, and restarting Sunshine underneath any live stream.

- name: Warn when Sunshine credentials are not seeded
  ansible.builtin.debug:
    msg: >-
      sunshine_admin_password is not set — Sunshine will require interactive
      account creation at https://{{ ansible_host | default(inventory_hostname) }}:47990
      before any Moonlight client can pair.
  when: sunshine_admin_password is not defined

# Sway starts Sunshine on (re)launch, but on the first converge Sway is already
# up (started earlier in wayland-display) before this unit existed — so start it
# explicitly now. Sway has already imported WAYLAND_DISPLAY into the user env, so
# the service attaches to the running session.
- name: Reload and start the Sunshine user service
  become: true
  become_user: "{{ gaming_user }}"
  ansible.builtin.systemd:
    name: sunshine
    scope: user
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[gaming_user][1] | default(1000) }}"
  failed_when: false

- name: Display Sunshine setup info
  ansible.builtin.debug:
    msg: |
      ========================================
      Sunshine Setup Complete!

      Web UI: https://{{ ansible_host }}:47990
      Default credentials: sunshine / sunshine

      To pair a Moonlight client:
      1. Open the web UI above
      2. Go to PIN tab
      3. Enter the PIN from your Moonlight app
      ========================================

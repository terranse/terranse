---
# Sunshine Streaming Server Setup
#
# Installs and configures Sunshine for game streaming via Moonlight

- name: Install Sunshine dependencies
  ansible.builtin.apt:
    name:
      - libavcodec-dev
      - libdrm-dev
      - libevdev-dev
      - libpulse-dev
      - libx11-dev
      - libxfixes-dev
      - libxrandr-dev
      - libxtst-dev
      - libcap2-bin
      - libssl-dev
      - libcurl4-openssl-dev
      - libopus-dev
      - libboost-all-dev
      - cmake
      - g++
    state: present

# Install Sunshine from package or AppImage
- name: Check if Sunshine is installed
  ansible.builtin.command: which sunshine
  register: sunshine_installed
  changed_when: false
  failed_when: false

- name: Create Sunshine directory
  ansible.builtin.file:
    path: /opt/sunshine
    state: directory
    mode: '0755'

- name: Download Sunshine package matching the guest OS
  # Use the .deb built for this exact Ubuntu release so apt can resolve its
  # dependencies (the generic debian-bookworm build depends on libmfx1, which
  # no longer exists on Ubuntu 26.04).
  ansible.builtin.get_url:
    url: "https://github.com/LizardByte/Sunshine/releases/download/{{ sunshine_version }}/sunshine-ubuntu-{{ ansible_distribution_version }}-amd64.deb"
    dest: /tmp/sunshine.deb
    mode: '0644'
    force: true # always fetch the OS-matched build; never reuse a stale download
  when: sunshine_installed.rc != 0

- name: Install Sunshine package
  ansible.builtin.apt:
    deb: /tmp/sunshine.deb
    state: present
  when: sunshine_installed.rc != 0

- name: Clean up Sunshine download
  ansible.builtin.file:
    path: /tmp/sunshine.deb
    state: absent

# Configure Sunshine
- name: Create Sunshine config directory
  ansible.builtin.file:
    path: "/home/{{ gaming_user }}/.config/sunshine"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'

# Session hooks for GPU management
- name: Create Sunshine hooks directory
  ansible.builtin.file:
    path: /opt/sunshine/hooks
    state: directory
    mode: '0755'

- name: Deploy session start hook
  ansible.builtin.template:
    src: sunshine-session-start.sh.j2
    dest: /opt/sunshine/hooks/session-start.sh
    mode: '0755'

- name: Deploy session stop hook
  ansible.builtin.template:
    src: sunshine-session-stop.sh.j2
    dest: /opt/sunshine/hooks/session-stop.sh
    mode: '0755'

- name: Deploy Sunshine configuration
  ansible.builtin.template:
    src: sunshine.conf.j2
    dest: "/home/{{ gaming_user }}/.config/sunshine/sunshine.conf"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'
  notify: Restart sunshine

- name: Deploy Sunshine apps configuration
  ansible.builtin.template:
    src: sunshine-apps.json.j2
    dest: "/home/{{ gaming_user }}/.config/sunshine/apps.json"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'
  notify: Restart sunshine

# Mount shared credentials from NFS (if available)
- name: Check if shared credentials mount exists
  ansible.builtin.stat:
    path: /mnt/sunshine-creds
  register: creds_mount

- name: Create credentials symlink
  ansible.builtin.file:
    src: /mnt/sunshine-creds
    dest: "/home/{{ gaming_user }}/.config/sunshine/credentials"
    state: link
    force: true
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
  # Optional NFS credential sharing — never block the deploy if the dest already
  # exists as a real directory (no NFS share present on this VM).
  when: creds_mount.stat.exists | default(false)
  failed_when: false

# Set capabilities for Sunshine — cap_sys_admin is required for KMS capture and
# lets Sunshine run as an unprivileged user service (no AmbientCapabilities in
# the unit).
- name: Set capabilities for Sunshine
  community.general.capabilities:
    path: /usr/bin/sunshine
    capability: cap_sys_admin+ep
    state: present
  failed_when: false

# -----------------------------------------------------------------------------
# Input: Sunshine injects the Moonlight client's mouse/keyboard/gamepad via
# /dev/uinput. Without this udev rule it fails with "Could not create Sunshine
# Mouse/Gamepad: Permission denied".
# -----------------------------------------------------------------------------
- name: Ensure uinput module loads at boot
  ansible.builtin.copy:
    content: "uinput\n"
    dest: /etc/modules-load.d/uinput.conf
    mode: '0644'

- name: Load uinput module now
  community.general.modprobe:
    name: uinput
    state: present
  failed_when: false

- name: Install Sunshine uinput udev rule
  ansible.builtin.copy:
    content: |
      KERNEL=="uinput", SUBSYSTEM=="misc", OPTIONS+="static_node=uinput", TAG+="uaccess"
    dest: /etc/udev/rules.d/85-sunshine-input.rules
    mode: '0644'
  register: sunshine_udev

- name: Reload udev rules
  ansible.builtin.command: "{{ item }}"
  loop:
    - udevadm control --reload-rules
    - udevadm trigger
  changed_when: false
  when: sunshine_udev is changed

# -----------------------------------------------------------------------------
# Sunshine runs as a user service in the gamer session (started by Sway). Modern
# Sunshine forces interactive web-UI account creation before pairing, so we seed
# credentials non-interactively here (the stdin `-0` flag is broken upstream).
# -----------------------------------------------------------------------------
- name: Create Sunshine user systemd directory
  ansible.builtin.file:
    path: "/home/{{ gaming_user }}/.config/systemd/user"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'

- name: Create Sunshine user service
  ansible.builtin.template:
    src: sunshine.service.j2
    dest: "/home/{{ gaming_user }}/.config/systemd/user/sunshine.service"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'

# An empty/zero-byte cert from an interrupted earlier run makes Sunshine abort on
# startup ("use_certificate_chain_file: no start line"). Remove empties so the
# creds seed (and Sunshine's first launch) regenerate them cleanly.
- name: Find Sunshine cert files
  ansible.builtin.find:
    paths: "/home/{{ gaming_user }}/.config/sunshine/credentials"
    patterns: "*.pem"
    file_type: file
  register: sunshine_empty_certs
  failed_when: false

- name: Remove empty Sunshine cert files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sunshine_empty_certs.files | default([]) | selectattr('size', 'eq', 0) | list }}"
  loop_control:
    label: "{{ item.path }}"

- name: Seed Sunshine web-UI credentials (non-interactive)
  become: true
  become_user: "{{ gaming_user }}"
  ansible.builtin.command:
    cmd: "sunshine --creds {{ sunshine_admin_user | default('admin') }} {{ sunshine_admin_password }}"
  when: sunshine_admin_password is defined
  no_log: true
  changed_when: true

- name: Warn when Sunshine credentials are not seeded
  ansible.builtin.debug:
    msg: >-
      sunshine_admin_password is not set — Sunshine will require interactive
      account creation at https://{{ ansible_host | default(inventory_hostname) }}:47990
      before any Moonlight client can pair.
  when: sunshine_admin_password is not defined

# Sway starts Sunshine on (re)launch, but on the first converge Sway is already
# up (started earlier in wayland-display) before this unit existed — so start it
# explicitly now. Sway has already imported WAYLAND_DISPLAY into the user env, so
# the service attaches to the running session.
- name: Reload and start the Sunshine user service
  become: true
  become_user: "{{ gaming_user }}"
  ansible.builtin.systemd:
    name: sunshine
    scope: user
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[gaming_user][1] | default(1000) }}"
  failed_when: false

- name: Display Sunshine setup info
  ansible.builtin.debug:
    msg: |
      ========================================
      Sunshine Setup Complete!

      Web UI: https://{{ ansible_host }}:47990
      Default credentials: sunshine / sunshine

      To pair a Moonlight client:
      1. Open the web UI above
      2. Go to PIN tab
      3. Enter the PIN from your Moonlight app
      ========================================

---
# Game Sync Service Deployment
#
# Installs and configures the game-sync-service that bridges
# Lutris's game database with Sunshine's app list.

- name: Create game-sync directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0755'
  loop:
    - /etc/game-sync
    - /var/lib/game-sync
    - /var/lib/game-sync/covers

# Ubuntu 26.04 marks the system interpreter externally-managed (PEP 668), so a
# system-wide `pip3 install` refuses to run. Install into a dedicated venv and
# expose the entry point where the unit expects it.
- name: Ensure venv support is present
  ansible.builtin.apt:
    name: "python3-venv"
    state: present
  become: true

# game-sync-service lives in a private GitHub repo, and the VM has no credentials
# for it — `pip install git+https://…` dies with "could not read Username for
# 'https://github.com'". Ship the built wheel with the role instead, the same way
# the nvlts binary is vendored. Set game_sync_package_url to install from a URL
# (a public repo, an index, a deploy-key ssh remote) and this is bypassed.
- name: Stage the vendored game-sync wheel
  ansible.builtin.copy:
    src: "{{ game_sync_wheel }}"
    dest: "/tmp/{{ game_sync_wheel }}"
    mode: '0644'
  become: true
  when: game_sync_package_url | length == 0

- name: Install game-sync-service into its own venv
  ansible.builtin.pip:
    name: "{{ game_sync_package_url if game_sync_package_url | length > 0 else '/tmp/' + game_sync_wheel }}"
    state: present
    virtualenv: /opt/game-sync
    virtualenv_command: python3 -m venv
  become: true
  notify: Restart game-sync

- name: Expose the game-sync entry point on PATH
  ansible.builtin.file:
    src: /opt/game-sync/bin/game-sync-service
    dest: /usr/local/bin/game-sync-service
    state: link
  become: true

- name: Deploy game-sync configuration
  ansible.builtin.template:
    src: game-sync.conf.j2
    dest: /etc/game-sync/game-sync.conf
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'
  notify: Restart game-sync

- name: Deploy game-sync systemd service
  ansible.builtin.template:
    src: game-sync.service.j2
    dest: /etc/systemd/system/game-sync.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart game-sync

- name: Enable and start game-sync service
  ansible.builtin.systemd:
    name: game-sync
    enabled: true
    state: started
    daemon_reload: true

---
# Wayland Virtual Display Setup
#
# Configures a Wayland compositor for headless gaming streaming.
# Options: gamescope (recommended), cage, or sway
#
# Variables:
#   wayland_compositor: gamescope|cage|sway (default: gamescope)
#   virtual_display_width: Display width (default: 1920)
#   virtual_display_height: Display height (default: 1080)
#   virtual_display_refresh: Refresh rate (default: 60)

# =============================================================================
# Create required directories
# =============================================================================
- name: Create /opt/gaming directory
  ansible.builtin.file:
    path: /opt/gaming
    state: directory
    mode: '0755'

# =============================================================================
# Install Wayland components
# =============================================================================
- name: Install common Wayland packages
  ansible.builtin.apt:
    name:
      - pipewire
      - pipewire-pulse
      - wireplumber
      - pulseaudio-utils  # provides pactl for the virtual null audio sink
      - libdrm2
      - libegl1
      - libgbm1
      - xwayland  # For X11 game compatibility
      - seatd     # see below: without a seat, sway has no input devices at all
    state: present

# Sway must be able to SEE Sunshine's virtual input devices.
#
# Sunshine injects the Moonlight client's mouse and keyboard through uinput, and those
# are real evdev devices — but wlroots only enumerates input through its *libinput*
# backend, which `WLR_BACKENDS=headless` never starts. So the compositor ran with zero
# input devices and every click and keystroke from the couch went nowhere. Only
# gamepads appeared to work, because Steam reads evdev itself and Big Picture draws its
# own cursor; the moment anything showed a plain window — a Steam dialog, an EA App
# sign-in, the sway desktop — it was completely uninteractable.
#
# libinput needs a seat, and a lingering user service has no logind seat, hence seatd.
# Ubuntu ships it as `seatd -g video`, so the seat socket is group-owned by `video` and
# the gaming user must be in it (and in `input` to open the devices).
- name: Enable seatd (gives the headless compositor a seat for libinput)
  ansible.builtin.systemd:
    name: seatd
    enabled: true
    state: started

- name: Let the gaming user open seat and input devices
  ansible.builtin.user:
    name: "{{ gaming_user }}"
    groups: video,input
    append: true
  # The user manager caches its supplementary groups at start, so a fresh membership
  # only reaches sway once the session is restarted.
  notify: Restart gaming session

# NetworkManager must own the interface: Steam's -steamos mode reads network
# state from it over D-Bus, and with the default networkd renderer NM owns
# nothing. netplan renders NM connections instead; networkd must then let go of
# the link, or NM reports it as "connected (externally)" and Steam still sees
# no network.
- name: Install NetworkManager (Steam reads network state from it)
  ansible.builtin.apt:
    name: network-manager
    state: present

- name: Render the network with NetworkManager instead of systemd-networkd
  ansible.builtin.template:
    src: netplan-nm-renderer.yaml.j2
    dest: /etc/netplan/60-gaming.yaml
    mode: '0600'
  register: _gaming_netplan

- name: Stop systemd-networkd owning the link
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - systemd-networkd.service
    - systemd-networkd.socket
  failed_when: false
  when: _gaming_netplan is changed

- name: Apply the network configuration
  ansible.builtin.command: netplan apply
  changed_when: true
  when: _gaming_netplan is changed

# The guest has no sound card, so declare the sink Sunshine captures. It must be
# a PipeWire object rather than a `pactl load-module` call from the session: the
# runtime module did not survive between sessions, PipeWire fell back to
# auto_null, and every stream came up silent.
- name: Ensure the PipeWire drop-in directory exists
  ansible.builtin.file:
    path: /etc/pipewire/pipewire.conf.d
    state: directory
    mode: '0755'

- name: Declare the Sunshine capture sink to PipeWire
  ansible.builtin.template:
    src: pipewire-sunshine-sink.conf.j2
    dest: /etc/pipewire/pipewire.conf.d/99-sunshine-sink.conf
    mode: '0644'

# Gamescope - Valve's gaming compositor (recommended)
# The session the user actually sees: gamescope nested inside sway. See
# templates/gamescope-session.service.j2 for why sway alone cannot do this job.
- name: Install gamescope for the nested session
  ansible.builtin.apt:
    name: gamescope
    state: present
  when: gamescope_session | default(true)

# gamescope needs Vulkan, and the vGPU installer leaves it unusable outside the Steam
# sandbox: it drops the NVIDIA GL/Vulkan libraries in place but registers no ICD, so
# /usr/share/vulkan/icd.d holds only Mesa drivers and host-side Vulkan resolves to
# llvmpipe — software rendering. (Games were unaffected: pressure-vessel injects its own
# nvidia_icd.json inside the Steam runtime, which is why this stayed invisible.)
- name: Register the NVIDIA Vulkan ICD for host-side clients
  ansible.builtin.copy:
    content: |
      {
          "file_format_version" : "1.0.0",
          "ICD": {
              "library_path": "libGLX_nvidia.so.0",
              "api_version" : "1.3.242"
          }
      }
    dest: /usr/share/vulkan/icd.d/nvidia_icd.json
    mode: '0644'
  when:
    - gamescope_session | default(true)
    - gpu_type | default('') == 'nvidia_vgpu'

- name: Deploy the gamescope session service
  ansible.builtin.template:
    src: gamescope-session.service.j2
    dest: "/home/{{ gaming_user }}/.config/systemd/user/gamescope-session.service"
    owner: "{{ gaming_user }}"
    group: "{{ gaming_user }}"
    mode: '0644'
  when: gamescope_session | default(true)
  notify: Restart gaming session

- name: Install gamescope
  when: wayland_compositor == 'gamescope'
  block:
    - name: Check if gamescope is available in repos
      ansible.builtin.command: apt-cache show gamescope
      register: gamescope_available
      changed_when: false
      failed_when: false

    - name: Install gamescope from repos
      ansible.builtin.apt:
        name: gamescope
        state: present
      when: gamescope_available.rc == 0

    - name: Install gamescope from Flatpak (fallback)
      community.general.flatpak:
        name: org.freedesktop.Platform.VulkanLayer.gamescope
        state: present
      when: gamescope_available.rc != 0
      failed_when: false

    - name: Deploy gamescope session script
      ansible.builtin.template:
        src: gamescope-session.sh.j2
        dest: /opt/gaming/gamescope-session.sh
        mode: '0755'

    - name: Deploy gamescope systemd service
      ansible.builtin.template:
        src: gamescope-gaming.service.j2
        dest: /etc/systemd/system/gamescope-gaming.service
        mode: '0644'
      notify: Reload systemd

# Cage - Minimal kiosk compositor
- name: Install cage compositor
  when: wayland_compositor == 'cage'
  block:
    - name: Install cage
      ansible.builtin.apt:
        name: cage
        state: present

    - name: Deploy cage systemd service
      ansible.builtin.template:
        src: cage-gaming.service.j2
        dest: /etc/systemd/system/cage-gaming.service
        mode: '0644'
      notify: Reload systemd

# Sway - Full-featured tiling compositor
- name: Install sway compositor
  when: wayland_compositor == 'sway'
  block:
    - name: Install sway and tools
      ansible.builtin.apt:
        name:
          - sway
          - swaybg
          - swayidle
          - wlr-randr
          - foot  # Terminal — also the Desktop session's escape hatch
          - wofi  # App launcher, so Moonlight's "Desktop" is not an empty screen
        state: present

    - name: Create sway config directory
      ansible.builtin.file:
        path: "/home/{{ gaming_user }}/.config/sway"
        state: directory
        owner: "{{ gaming_user }}"
        group: "{{ gaming_user }}"
        mode: '0755'

    - name: Deploy sway configuration
      ansible.builtin.template:
        src: sway-headless.conf.j2
        dest: "/home/{{ gaming_user }}/.config/sway/config"
        owner: "{{ gaming_user }}"
        group: "{{ gaming_user }}"
        mode: '0644'

    - name: Create user systemd directory
      ansible.builtin.file:
        path: "/home/{{ gaming_user }}/.config/systemd/user"
        state: directory
        owner: "{{ gaming_user }}"
        group: "{{ gaming_user }}"
        mode: '0755'

    - name: Deploy sway-gaming user service
      ansible.builtin.template:
        src: sway-gaming.service.j2
        dest: "/home/{{ gaming_user }}/.config/systemd/user/sway-gaming.service"
        owner: "{{ gaming_user }}"
        group: "{{ gaming_user }}"
        mode: '0644'

# =============================================================================
# Enable and start the gaming session
#
# Sway runs as a user service in the gamer session (lingering, so it starts at
# boot without an interactive login). This replaces the old lightdm autologin +
# system-service path, which double-launched the compositor. The user-service
# model also lets Sway import WAYLAND_DISPLAY into the user environment so the
# Sunshine user service attaches reliably, and gives Sunshine access to the
# user's PipeWire for audio capture.
# =============================================================================
- name: Enable lingering for the gaming user (start user services at boot)
  ansible.builtin.command: "loginctl enable-linger {{ gaming_user }}"
  changed_when: false
  when: wayland_compositor == 'sway'

- name: Look up the gaming user uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ gaming_user }}"
  when: wayland_compositor == 'sway'

- name: Enable and start the sway gaming user service
  become: true
  become_user: "{{ gaming_user }}"
  ansible.builtin.systemd:
    name: sway-gaming
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[gaming_user][1] }}"
  when: wayland_compositor == 'sway'

# Legacy display-manager path for gamescope/cage (not used for vGPU streaming —
# headless gamescope cannot be captured on NVIDIA; Sway is the supported path).
- name: Configure legacy gamescope/cage display-manager session
  when: wayland_compositor in ['gamescope', 'cage']
  block:
    - name: Ensure wayland-sessions directory exists
      ansible.builtin.file:
        path: /usr/share/wayland-sessions
        state: directory
        mode: '0755'

    - name: Create gaming Wayland session desktop entry
      ansible.builtin.copy:
        content: |
          [Desktop Entry]
          Name=Gaming Session ({{ wayland_compositor | title }})
          Comment=Wayland gaming session with Sunshine streaming
          Exec=/opt/gaming/{{ wayland_compositor }}-session.sh
          Type=Application
          DesktopNames={{ wayland_compositor | upper }}
        dest: /usr/share/wayland-sessions/gaming-{{ wayland_compositor }}.desktop
        mode: '0644'

    - name: Configure auto-login to Wayland session
      ansible.builtin.copy:
        content: |
          [Seat:*]
          autologin-user={{ gaming_user }}
          autologin-session=gaming-{{ wayland_compositor }}
        dest: /etc/lightdm/lightdm.conf.d/50-gaming-wayland.conf
        mode: '0644'
      when: ansible_facts.services['lightdm.service'] is defined

    - name: Enable gaming Wayland service
      ansible.builtin.systemd:
        name: "{{ wayland_compositor }}-gaming"
        enabled: true
        daemon_reload: true

- name: Display Wayland setup info
  ansible.builtin.debug:
    msg: |
      ========================================
      Wayland Gaming Session Configured!

      Compositor: {{ wayland_compositor }}
      Resolution: {{ virtual_display_width | default(1920) }}x{{ virtual_display_height | default(1080) }}@{{ virtual_display_refresh | default(60) }}Hz

      The compositor creates a virtual display automatically.
      Sunshine captures via KMS for low-latency streaming.

      To change resolution dynamically:
      {% if wayland_compositor == 'gamescope' %}
        Reconnect with different resolution in Moonlight
        (gamescope can rescale on the fly)
      {% elif wayland_compositor == 'sway' %}
        wlr-randr --output HEADLESS-1 --mode 2560x1440
      {% endif %}
      ========================================

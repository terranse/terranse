---
# Headless install tooling for game-sync.
#
# Steam installs go through the Steam client already running in the session, so
# they only need xdotool to confirm its dialog. Epic has no client running, so it
# uses legendary to install and umu-launcher with a pinned GE-Proton to launch.
#
# Guarded by game_sync_install_enabled so a host that only plays games does not
# carry an installer it never runs.

- name: Install headless game installers
  when: game_sync_install_enabled | bool
  block:
    - name: Install xdotool to confirm Steam's install dialog
      ansible.builtin.apt:
        name: xdotool
        state: present
      become: true

    # umu-launcher only ships per-distro packages. resolute is Ubuntu 26.04.
    - name: Read the installed umu-launcher version
      ansible.builtin.command: dpkg-query -W -f=${Version} python3-umu-launcher
      register: _umu_installed
      changed_when: false
      failed_when: false

    - name: Install umu-launcher
      ansible.builtin.apt:
        deb: "https://github.com/Open-Wine-Components/umu-launcher/releases/download/{{ umu_version }}/python3-umu-launcher_{{ umu_version }}-1_amd64_ubuntu-{{ ansible_distribution_release }}.deb"
      become: true
      when: umu_version not in _umu_installed.stdout

    # Epic's Proton, separate from the unpinned copy inside Flatpak Steam, so a
    # new build can't change how an installed game behaves.
    - name: Create the Proton directory
      ansible.builtin.file:
        path: "{{ epic_proton_dir | dirname }}"
        state: directory
        mode: '0755'
      become: true

    - name: Install the pinned GE-Proton
      ansible.builtin.unarchive:
        src: "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/{{ epic_proton_version }}/{{ epic_proton_version }}-x86_64.tar.gz"
        dest: "{{ epic_proton_dir | dirname }}"
        remote_src: true
        creates: "{{ epic_proton_dir }}/proton"
      become: true

    - name: Create the Epic install directory on the pool
      ansible.builtin.file:
        path: "{{ epic_install_dir }}"
        state: directory
        owner: "{{ gaming_user }}"
        group: "{{ gaming_user }}"
        mode: '0755'
      become: true

    # legendary is a Python app; the system interpreter is externally managed
    # (PEP 668) on Ubuntu 26.04, so it gets its own venv like game-sync does.
    - name: Install legendary into its own venv
      ansible.builtin.pip:
        name: "legendary-gl=={{ legendary_version }}"
        state: present
        virtualenv: /opt/legendary
        virtualenv_command: python3 -m venv
      become: true

    - name: Expose the legendary entry point on PATH
      ansible.builtin.file:
        src: /opt/legendary/bin/legendary
        dest: /usr/local/bin/legendary
        state: link
      become: true

    # Heroic is the Epic library screen. legendary does the automation, because
    # Heroic has no headless list or install and raises dialogs on failure.
    - name: Install Heroic
      community.general.flatpak:
        name: com.heroicgameslauncher.hgl
        state: present
        method: system
      become: true

    # On local disk: gpu-manager's virtiofs mounts are not the place for the login.
    - name: Create legendary's config directory
      ansible.builtin.file:
        path: "{{ legendary_config_dir }}"
        state: directory
        owner: "{{ gaming_user }}"
        group: "{{ gaming_user }}"
        mode: '0700'
      become: true

    - name: Point out the one manual step
      ansible.builtin.debug:
        msg: >-
          Epic needs one manual login. Get a code from https://legendary.gl/epiclogin, then run:
          sudo -u {{ gaming_user }} -H LEGENDARY_CONFIG_PATH={{ legendary_config_dir }}
          /opt/legendary/bin/legendary auth --code <CODE>

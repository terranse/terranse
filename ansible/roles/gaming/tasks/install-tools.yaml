---
# Headless install tooling for game-sync (couch install).
#
# steamcmd and legendary are what game-sync shells out to when a game is
# installed from the TV. Both write into the shared game pool, so the machine
# running them does not have to be the machine that plays them — which is the
# whole reason installing never needs the gaming VM awake.
#
# Guarded by game_sync_install_enabled so a host that only plays games does not
# carry an installer it never runs.

- name: Install headless game installers
  when: game_sync_install_enabled | bool
  block:
    # steamcmd lives in multiverse and its licence prompt blocks a non-
    # interactive apt run, so accept it up front via debconf.
    - name: Enable the multiverse component for steamcmd
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu {{ ansible_distribution_release }} multiverse"
        state: present
        filename: multiverse
      become: true

    - name: Pre-accept the Steam licence
      ansible.builtin.debconf:
        name: steam
        question: steam/question
        value: "I AGREE"
        vtype: select
      become: true

    - name: Pre-accept the Steam licence note
      ansible.builtin.debconf:
        name: steam
        question: steam/license
        value: ""
        vtype: note
      become: true

    - name: Install steamcmd
      ansible.builtin.apt:
        name: steamcmd
        state: present
        update_cache: true
      become: true

    # legendary is a Python app; the system interpreter is externally managed
    # (PEP 668) on Ubuntu 26.04, so it gets its own venv like game-sync does.
    - name: Install legendary into its own venv
      ansible.builtin.pip:
        name: legendary-gl
        state: present
        virtualenv: /opt/legendary
        virtualenv_command: python3 -m venv
      become: true

    - name: Expose the legendary entry point on PATH
      ansible.builtin.file:
        src: /opt/legendary/bin/legendary
        dest: /usr/local/bin/legendary
        state: link
      become: true

    # The Guard refresh token and legendary's auth both live here rather than in
    # a home directory, so a rebuild of the host does not throw the logins away.
    - name: Create the shared installer state directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ gaming_user }}"
        group: "{{ gaming_user }}"
        # 0700: config.vdf is a live Steam session token and legendary's
        # directory holds Epic auth. These are credentials, not saves.
        mode: '0700'
      become: true
      loop:
        - "{{ game_sync_state_dir }}"
        - "{{ game_sync_state_dir }}/steamcmd"
        - "{{ game_sync_state_dir }}/legendary"

    - name: Report what still needs a human
      ansible.builtin.debug:
        msg: |
          ========================================
          Headless installers ready.

          STILL REQUIRED, ONCE, BY HAND — steamcmd cannot log in
          non-interactively until a Steam Guard refresh token is cached:

            sudo -u {{ gaming_user }} steamcmd +login {{ steam_username | default('<user>') }}

          Enter the Guard code when prompted, then quit. The token expires
          after some months; when it does, install jobs fail with
          "Steam login expired — reseed the steamcmd token on the worker".

          Epic needs the equivalent:  sudo -u {{ gaming_user }} legendary auth
          ========================================
      when: steam_username | length > 0

    - name: Warn when Steam installs cannot work
      ansible.builtin.debug:
        msg: >-
          steam_username is unset, so game-sync will not offer Steam installs.
          Set it (and seed the Guard token) to enable them.
      when: steam_username | length == 0

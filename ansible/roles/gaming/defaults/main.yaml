---
# Default variables for gaming role

# User for gaming sessions
gaming_user: gamer

# GPU type (set by OpenTofu)
# gpu_type: nvidia_vgpu

# Display configuration
# Sway (headless wlroots output) is the supported streaming compositor: on
# NVIDIA, headless gamescope produces no capturable output, whereas Sunshine
# captures a headless Sway session via wlroots screencopy (WLR_RENDERER=gles2).
wayland_compositor: sway
display_server: wayland
virtual_display_width: 1920
virtual_display_height: 1080
virtual_display_refresh: 60

# Application toggles
sunshine_enabled: true
# Pinned Sunshine release. The role downloads the .deb matching the guest's
# Ubuntu version (sunshine-ubuntu-<ver>-amd64.deb) so dependencies resolve —
# the old debian-bookworm build pulls libmfx1, which was removed in Ubuntu 26.04.
sunshine_version: v2026.516.143833
steam_enabled: true
retroarch_enabled: false

# Storage configuration
game_storage_mount: true
# nfs_server: 192.168.1.x

# Snapshot configuration
snapshot_on_boot: true

# Lutris game manager
lutris_enabled: true
lutris_install_method: flatpak  # flatpak or apt

# Store integrations (credentials fetched from 1Password)
epic_enabled: true
gog_enabled: true
# 1Password item names for store credentials
op_epic_item: "Epic Games"
op_gog_item: "GOG"

# Game sync service
game_sync_enabled: true
game_sync_port: 9766
game_sync_package: game-sync-service
# Override with URL or path for pre-release installs
# game_sync_package_url: https://...

# GPU Manager API (if running)
# gpu_manager_url: http://192.168.1.x:8080

# vGPU licensing via nvlts (NVIDIA Local Trusted Store): forge a permanent
# node-locked license into the driver's local store — fully offline, no DLS
# server, no cert chain, no driver patching. This is the only supported method;
# it works on all vGPU branches incl. 20.x/595 (which FastAPI-DLS cannot license
# because the NLS root CA moved into unpatchable GSP firmware). The legacy
# FastAPI-DLS flow was removed — see git history if it's ever needed for < 20.x.
nvlts_repo_url: https://git.collinwebdesigns.de/vgpu/nvlts
nvlts_vendored_commit: e639414
# Used only if the live driver version can't be read when the license is generated.
nvlts_fallback_driver_version: "595.58.03"
# License product/feature. Defaults match FeatureType 2 (RTX Virtual Workstation,
# e.g. the A5000 RTXA5000-8Q profile). For other profiles set these to the
# matching values (e.g. vPC: "NVIDIA Virtual PC" / "GRID-Virtual-PC" / "2.0").
vgpu_product_name: "NVIDIA RTX Virtual Workstation"
vgpu_feature_name: "Quadro-Virtual-DWS"
vgpu_feature_version: "5.0"

# vGPU FeatureType: 2 = RTX vWS (A5000 Q-series profile). 1 = vGPU/vPC, 4 = vCS.
vgpu_feature_type: 2

# Sunshine web-UI admin account, seeded non-interactively so Moonlight can pair.
sunshine_admin_user: admin
# Random password generated and stored in 1Password. Seeding creds also makes
# Sunshine generate its web-UI TLS cert on first run (an absent/empty cert
# otherwise crashes it with "use_certificate_chain_file: no start line").
sunshine_admin_password: "{{ lookup('community.general.onepassword', 'Sunshine Gaming', vault='Infrastructure', field='password') }}"

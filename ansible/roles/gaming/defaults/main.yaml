---
# Default variables for gaming role

# User for gaming sessions
gaming_user: gamer

# GPU type (set by OpenTofu)
# gpu_type: nvidia_vgpu

# Display configuration
# Sway (headless wlroots output) is the supported streaming compositor: on
# NVIDIA, headless gamescope produces no capturable output, whereas Sunshine
# captures a headless Sway session via wlroots screencopy (WLR_RENDERER=gles2).
wayland_compositor: sway
display_server: wayland
virtual_display_width: 1920
virtual_display_height: 1080
virtual_display_refresh: 60

# Application toggles
sunshine_enabled: true
# Pinned Sunshine release. The role downloads the .deb matching the guest's
# Ubuntu version (sunshine-ubuntu-<ver>-amd64.deb) so dependencies resolve —
# the old debian-bookworm build pulls libmfx1, which was removed in Ubuntu 26.04.
sunshine_version: v2026.516.143833
steam_enabled: true
retroarch_enabled: false

# Storage configuration
game_storage_mount: true
# nfs_server: 192.168.1.x

# Snapshot configuration
snapshot_on_boot: true

# Lutris game manager
lutris_enabled: true
lutris_install_method: flatpak  # flatpak or apt

# Store integrations (credentials fetched from 1Password)
epic_enabled: true
gog_enabled: true
# 1Password item names for store credentials
op_epic_item: "Epic Games"
op_gog_item: "GOG"
op_igdb_item: "IGDB"
op_steamgriddb_item: "SteamGridDB"

# Game sync service
game_sync_enabled: true
game_sync_port: 9766
game_sync_package: game-sync-service
# The repo is private and the VM holds no GitHub credentials, so install the
# wheel shipped with this role (see files/). Rebuild it with `uv build` in
# game-sync-service and drop the new wheel here to upgrade.
game_sync_wheel: game_sync_service-0.1.0-py3-none-any.whl
# Set to install from a URL instead — a public repo, an index, or a git+ssh
# remote backed by a deploy key. Empty means "use the vendored wheel".
game_sync_package_url: ""

# --- headless installs (couch install) ---------------------------------------
# Off by default: enabling it without a seeded steamcmd Guard token produces
# installs that fail on every attempt.
game_sync_install_enabled: false
steamcmd_cmd: steamcmd
legendary_cmd: legendary
# The Steam account steamcmd logs in as. Empty means Steam installs are simply
# not offered, which is better than offering an Install button that cannot work.
steam_username: ""
# Lives in the HomeNetwork vault, not Infrastructure (verified 2026-08-18).
op_steam_api_item: "Steam Web API"
op_steam_api_vault: "HomeNetwork"
# Installer credentials (steamcmd Guard token, legendary auth) live on the
# shared pool so a host rebuild does not throw the logins away.
game_sync_state_dir: /mnt/games/config

# Sunshine web UI credentials (1Password item). Home Player reads the same item
# to post pairing PINs to Sunshine's API, so Moonlight clients pair without
# anyone typing a PIN. Empty values leave whatever credentials Sunshine already
# has, and pairing falls back to the web UI.
# Sunshine switches the default sink to this name at stream start and captures its
# monitor, so the sway session must create a null sink with exactly this name.
# Anything else and every stream comes up silent.
sunshine_audio_sink_name: sink-sunshine-stereo

# Emulated controller type presented to the guest (Sunshine option `gamepad`).
# xone = Xbox One layout, which matches 8BitDo/Xbox-style pads. Valid: auto,
# x360, xone, ds4, ds5, switch.
sunshine_gamepad: xone

# Encoder tuning. preset 1 is NVENC's fastest and spatial AQ buys quality this
# stream cannot show — those are safe latency wins.
#
# The two below decide whether a client on a real link sees a picture at all, so
# they stay at Sunshine's defaults. These are set HERE, not just as a template
# fallback: the template reads `{{ sunshine_fec_percentage | default(20) }}`, and a
# variable defined here wins over that default — so an earlier "wired links don't
# need FEC" edit that set fec=10/twopass=disabled here silently shipped despite the
# template saying 20, and reintroduced the exact 99.94%-dropped-frames freeze it was
# supposed to have fixed. FEC rebuilds whatever the network drops (a 1080p frame is
# ~70 UDP packets, so per-packet loss compounds into whole-frame loss); two-pass
# stops a single frame overshooting its bitrate target and bursting past the link.
# Do not lower either without measuring the actual link.
sunshine_nvenc_preset: 1
sunshine_nvenc_twopass: quarter_res
sunshine_nvenc_spatial_aq: disabled
sunshine_nvenc_vbv_increase: 0
sunshine_fec_percentage: 20

# Steam library on the shared pool (see the `mounts` list), so games do not fill
# the VM's small root disk.
steam_library_path: /mnt/games/pc
_steam_root: "/home/{{ gaming_user }}/.var/app/com.valvesoftware.Steam/.local/share/Steam"
_steam_libraryfolders: "{{ _steam_root }}/steamapps/libraryfolders.vdf"

# Per-game DXVK overrides, keyed by Steam `installdir` (the folder name under
# steamapps/common). Written as a `dxvk.conf` beside the game exe; see steam.yaml
# for why that beats a Steam launch option here.
#
# Frame caps matter more than usual on this host: the stream is a fixed 60 Hz
# pipeline, so a game that renders far above it does not get a smoother picture,
# it gets frame-pacing jitter — the frame the encoder samples is of arbitrary age.
# Games that vsync or cap themselves need no entry.
steam_game_dxvk_conf:
  "FlatOut 2":
    comment: |
      #
      # The ZOOM re-release ships dxwrapper with EnableVSync = 0 and
      # ForceVsyncMode = 0, and gamescope runs without --framerate-limit, so
      # nothing caps this 2006 D3D9 title at all — it renders many hundreds of fps
      # on the A5000. Uncapped, it also busy-loops a vCPU next to Sunshine's
      # capture/encode threads, which is exactly the contention that reads as
      # steering lag in a fast-paced racer.
    options:
      d3d9.maxFrameRate: 60

# Per-game Source-engine cvars, keyed by Steam `installdir` (the folder name
# under steamapps/common). `mod_dir` is the game directory INSIDE that install
# (Portal's is `portal`), because that is where the engine reads cfg/ from.
# Written as `cfg/autoexec.cfg`; see steam.yaml for why config.cfg and launch
# options were both measured and both rejected.
steam_game_source_cvars:
  "Portal":
    mod_dir: portal
    comment: |
      // (ASCII only on purpose: this file is parsed by a 2007 engine.)
      //
      // Portal segfaults while loading a level - reliably, 4 launches out of 4.
      // The crash is on the MatQueue0 thread, i.e. Source's threaded material
      // queue: materialsystem -> studiorender -> shaderapidx9 -> a corrupted
      // pointer in libc. Portal's GL translation layer (ToGL/shaderapidx9) is
      // not safe to drive from that queue.
      //
      // mat_queue_mode -1 means "auto", and auto turns threading ON because
      // this guest has 12 cores - so the crash is a property of the VM's core
      // count, not of the install. 0 forces the synchronous path: measured 4/4
      // crashes at -1 against 4/4 clean runs at 0, and 3/3 clean with this file
      // in place while config.cfg was forced back to -1 between runs.
      //
      // This is the "Multicore Rendering" toggle in the game's advanced video
      // options. Other pre-Portal-2 Source titles on the pool are likely to
      // need the same entry.
    cvars:
      mat_queue_mode: 0

# Number of X servers gamescope runs. 2 asks for the Steam UI and games to be kept
# apart, to stop Steam replacing a running game with Big Picture when it takes focus.
# Steam honours it (games get DISPLAY=:2) but gamescope 3.16.20 does not put the game
# window there, so this does NOT fix the blackout on its own — see the status note in
# gamescope-session.service.j2. Set to 1 to revert to a single server.
gamescope_xwayland_count: 2

# Vulkan shader pre-caching. See tasks/shader-cache.yaml for the measurements
# behind these numbers.
shader_cache_tuning: true

# Threads handed to fossilize_replay. Steam picks this itself otherwise, and that
# choice can collapse to one core no matter how many the guest has.
steam_shader_threads: "{{ ansible_processor_vcpus | default(4) }}"

# NVIDIA shader disk cache budget, in bytes. The driver default is 1 GiB, and a
# single large title here produces a 2.06 GiB cache — over budget, so the driver
# prunes it and the whole 5-minute replay runs again next launch. 8 GiB clears the
# biggest thing the library has produced with room to spare.
nvidia_shader_cache_size: 8589934592

# Removes the size limit entirely rather than raising it. Some reports say the
# limit above is not always honoured and only this works. Left off because it lets
# the cache grow without bound, and the generic cache sits on the VM's 61 GB root
# disk — turn it on only if the replay still repeats with the budget raised.
nvidia_shader_cache_skip_cleanup: false

# Give the headless session a launcher and a terminal, so Moonlight's "Desktop"
# is usable rather than a black screen with nothing running on it.
gaming_desktop_launcher: true
gaming_desktop_terminal: foot
gaming_desktop_menu: "wofi --show drun"

# Host datasets shared into this VM over virtiofs. Tofu passes the VM's `mounts`
# list through the inventory as JSON; the virtiofs tag is the mapping name.
vm_mounts: "{{ mounts | default('[]') | from_json }}"

# Origins the Sunshine web UI may be reached from. Sunshine's CSRF check knows
# only localhost by default and blocks everything else, so list the addresses
# this guest is actually browsed at.
sunshine_web_port: 47990
sunshine_csrf_allowed_origins:
  - "https://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ sunshine_web_port }}"
  - "https://{{ inventory_hostname }}:{{ sunshine_web_port }}"
  - "https://localhost:{{ sunshine_web_port }}"

op_sunshine_item: "Sunshine Gaming"
sunshine_web_username: "{{ lookup('community.general.onepassword', op_sunshine_item, vault='Infrastructure', field='username', errors='warn') | default('', true) }}"
sunshine_web_password: "{{ lookup('community.general.onepassword', op_sunshine_item, vault='Infrastructure', field='password', errors='warn') | default('', true) }}"
# Sunshine stores only a hash, so we cannot detect a *changed* password. Set true
# to reprovision (rotation, or adopting an install whose password nobody knows).
sunshine_force_creds: false

# Metadata enrichment API keys (1Password items; register the free keys there).
# Absent items resolve to empty, which disables enrichment rather than failing
# the play — game-sync still syncs the library and enriches on a later scan
# once the keys exist.
igdb_client_id: "{{ lookup('community.general.onepassword', op_igdb_item, vault='Infrastructure', field='client_id', errors='warn') | default('', true) }}"
igdb_client_secret: "{{ lookup('community.general.onepassword', op_igdb_item, vault='Infrastructure', field='client_secret', errors='warn') | default('', true) }}"
steamgriddb_api_key: "{{ lookup('community.general.onepassword', op_steamgriddb_item, vault='Infrastructure', field='api_key', errors='warn') | default('', true) }}"
# Owned-catalogue credentials. Fail-soft like the others: a missing 1Password
# item disables the catalogue rather than aborting the play.
steam_web_api_key: "{{ lookup('community.general.onepassword', op_steam_api_item, vault=op_steam_api_vault, field='api_key', errors='warn') | default('', true) }}"
steam_id: "{{ lookup('community.general.onepassword', op_steam_api_item, vault=op_steam_api_vault, field='steam_id', errors='warn') | default('', true) }}"

# GPU Manager API (if running)
# gpu_manager_url: http://192.168.1.x:8080

# Sunshine web-UI admin account, seeded non-interactively so Moonlight can pair.
sunshine_admin_user: admin
# Random password generated and stored in 1Password. Seeding creds also makes
# Sunshine generate its web-UI TLS cert on first run (an absent/empty cert
# otherwise crashes it with "use_certificate_chain_file: no start line").
sunshine_admin_password: "{{ lookup('community.general.onepassword', 'Sunshine Gaming', vault='Infrastructure', field='password') }}"

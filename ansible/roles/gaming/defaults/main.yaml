---
# Default variables for gaming role

# User for gaming sessions
gaming_user: gamer

# GPU type (set by OpenTofu)
# gpu_type: nvidia_vgpu

# Display configuration
# Sway (headless wlroots output) is the supported streaming compositor: on
# NVIDIA, headless gamescope produces no capturable output, whereas Sunshine
# captures a headless Sway session via wlroots screencopy (WLR_RENDERER=gles2).
wayland_compositor: sway
display_server: wayland
virtual_display_width: 1920
virtual_display_height: 1080
virtual_display_refresh: 60

# Application toggles
sunshine_enabled: true
# Pinned Sunshine release. The role downloads the .deb matching the guest's
# Ubuntu version (sunshine-ubuntu-<ver>-amd64.deb) so dependencies resolve —
# the old debian-bookworm build pulls libmfx1, which was removed in Ubuntu 26.04.
sunshine_version: v2026.516.143833
steam_enabled: true
retroarch_enabled: false

# Storage configuration
game_storage_mount: true
# nfs_server: 192.168.1.x

# Snapshot configuration
snapshot_on_boot: true

# Lutris game manager
lutris_enabled: true
lutris_install_method: flatpak  # flatpak or apt

# Store integrations (credentials fetched from 1Password)
epic_enabled: true
gog_enabled: true
# 1Password item names for store credentials
op_epic_item: "Epic Games"
op_gog_item: "GOG"
op_igdb_item: "IGDB"
op_steamgriddb_item: "SteamGridDB"

# Game sync service
game_sync_enabled: true
game_sync_port: 9766
game_sync_package: game-sync-service
# The repo is private and the VM holds no GitHub credentials, so install the
# wheel shipped with this role (see files/). Rebuild it with `uv build` in
# game-sync-service and drop the new wheel here to upgrade.
game_sync_wheel: game_sync_service-0.1.0-py3-none-any.whl
# Set to install from a URL instead — a public repo, an index, or a git+ssh
# remote backed by a deploy key. Empty means "use the vendored wheel".
game_sync_package_url: ""

# Sunshine web UI credentials (1Password item). Home Player reads the same item
# to post pairing PINs to Sunshine's API, so Moonlight clients pair without
# anyone typing a PIN. Empty values leave whatever credentials Sunshine already
# has, and pairing falls back to the web UI.
# Sunshine switches the default sink to this name at stream start and captures its
# monitor, so the sway session must create a null sink with exactly this name.
# Anything else and every stream comes up silent.
sunshine_audio_sink_name: sink-sunshine-stereo

# Emulated controller type presented to the guest (Sunshine option `gamepad`).
# xone = Xbox One layout, which matches 8BitDo/Xbox-style pads. Valid: auto,
# x360, xone, ds4, ds5, switch.
sunshine_gamepad: xone

# Encoder tuning for latency over quality — this is a LAN game stream, not a
# recording. preset 1 is NVENC's fastest; two-pass and spatial AQ both buy image
# quality with encode time; FEC overhead is wasted on a wired link.
sunshine_nvenc_preset: 1
sunshine_nvenc_twopass: disabled
sunshine_nvenc_spatial_aq: disabled
sunshine_nvenc_vbv_increase: 0
sunshine_fec_percentage: 10

# Steam library on the shared pool (see the `mounts` list), so games do not fill
# the VM's small root disk.
steam_library_path: /mnt/games/pc
_steam_root: "/home/{{ gaming_user }}/.var/app/com.valvesoftware.Steam/.local/share/Steam"
_steam_libraryfolders: "{{ _steam_root }}/steamapps/libraryfolders.vdf"

# Give the headless session a launcher and a terminal, so Moonlight's "Desktop"
# is usable rather than a black screen with nothing running on it.
gaming_desktop_launcher: true
gaming_desktop_terminal: foot
gaming_desktop_menu: "wofi --show drun"

# Host datasets shared into this VM over virtiofs. Tofu passes the VM's `mounts`
# list through the inventory as JSON; the virtiofs tag is the mapping name.
vm_mounts: "{{ mounts | default('[]') | from_json }}"

# Origins the Sunshine web UI may be reached from. Sunshine's CSRF check knows
# only localhost by default and blocks everything else, so list the addresses
# this guest is actually browsed at.
sunshine_web_port: 47990
sunshine_csrf_allowed_origins:
  - "https://{{ ansible_host | default(ansible_default_ipv4.address) }}:{{ sunshine_web_port }}"
  - "https://{{ inventory_hostname }}:{{ sunshine_web_port }}"
  - "https://localhost:{{ sunshine_web_port }}"

op_sunshine_item: "Sunshine Gaming"
sunshine_web_username: "{{ lookup('community.general.onepassword', op_sunshine_item, vault='Infrastructure', field='username', errors='warn') | default('', true) }}"
sunshine_web_password: "{{ lookup('community.general.onepassword', op_sunshine_item, vault='Infrastructure', field='password', errors='warn') | default('', true) }}"
# Sunshine stores only a hash, so we cannot detect a *changed* password. Set true
# to reprovision (rotation, or adopting an install whose password nobody knows).
sunshine_force_creds: false

# Metadata enrichment API keys (1Password items; register the free keys there).
# Absent items resolve to empty, which disables enrichment rather than failing
# the play — game-sync still syncs the library and enriches on a later scan
# once the keys exist.
igdb_client_id: "{{ lookup('community.general.onepassword', op_igdb_item, vault='Infrastructure', field='client_id', errors='warn') | default('', true) }}"
igdb_client_secret: "{{ lookup('community.general.onepassword', op_igdb_item, vault='Infrastructure', field='client_secret', errors='warn') | default('', true) }}"
steamgriddb_api_key: "{{ lookup('community.general.onepassword', op_steamgriddb_item, vault='Infrastructure', field='api_key', errors='warn') | default('', true) }}"

# GPU Manager API (if running)
# gpu_manager_url: http://192.168.1.x:8080

# vGPU licensing via nvlts (NVIDIA Local Trusted Store): forge a permanent
# node-locked license into the driver's local store — fully offline, no DLS
# server, no cert chain, no driver patching. This is the only supported method;
# it works on all vGPU branches incl. 20.x/595 (which FastAPI-DLS cannot license
# because the NLS root CA moved into unpatchable GSP firmware). The legacy
# FastAPI-DLS flow was removed — see git history if it's ever needed for < 20.x.
nvlts_repo_url: https://git.collinwebdesigns.de/vgpu/nvlts
nvlts_vendored_commit: e639414
# Used only if the live driver version can't be read when the license is generated.
nvlts_fallback_driver_version: "595.58.03"
# License product/feature. Defaults match FeatureType 2 (RTX Virtual Workstation,
# e.g. the A5000 RTXA5000-8Q profile). For other profiles set these to the
# matching values (e.g. vPC: "NVIDIA Virtual PC" / "GRID-Virtual-PC" / "2.0").
vgpu_product_name: "NVIDIA RTX Virtual Workstation"
vgpu_feature_name: "Quadro-Virtual-DWS"
vgpu_feature_version: "5.0"

# vGPU FeatureType: 2 = RTX vWS (A5000 Q-series profile). 1 = vGPU/vPC, 4 = vCS.
vgpu_feature_type: 2

# Sunshine web-UI admin account, seeded non-interactively so Moonlight can pair.
sunshine_admin_user: admin
# Random password generated and stored in 1Password. Seeding creds also makes
# Sunshine generate its web-UI TLS cert on first run (an absent/empty cert
# otherwise crashes it with "use_certificate_chain_file: no start line").
sunshine_admin_password: "{{ lookup('community.general.onepassword', 'Sunshine Gaming', vault='Infrastructure', field='password') }}"

---
# gpu-manager daemon deployment.
#
# The daemon is built from source on the Ansible controller and copied over;
# there are no tagged releases yet.
gpu_manager_src: "{{ playbook_dir }}/../../../gpu-manager"

# Must match the mapping the drivers role registers over the vGPU virtual
# functions -- the daemon assigns profiles through it, and Proxmox picks a
# free function from it at VM start.
gpu_manager_pci_mapping: "{{ vgpu_pci_mapping_name | default('RTX-A5000') }}"

gpu_manager_listen: "0.0.0.0:8080"

# How long the daemon believes a reported session without hearing again. The
# gaming guests' Sunshine hooks report start and end over the daemon's API and
# heartbeat every 60s while a session is live, so this is three missed
# heartbeats. A session that decays this way reads as `unknown`, never `idle`:
# silence does not mean nobody is playing.
gpu_manager_session_ttl_s: 180
gpu_manager_grace_period_s: 300

# A virtual function stays held for a few seconds after its QEMU exits.
gpu_manager_vf_release_timeout_s: 60

# The VM that takes the card when another tenant releases it, so an idle card
# ends up doing something instead of nothing.
#
# Off by default: an empty map emits no stanza, and the daemon then leaves a
# freed card alone. Declared per-deployment (see the gpu-manager host_role in
# configurations.tfvars) rather than here, because which VM is the fallback is
# a property of the deployment, not of the role.
#
# The claim is made at the bottom of the priority order -- below even an idle
# game -- so it never blocks a VM somebody actually asked for, and it is
# edge-triggered: the tenant takes the card when another tenant releases it,
# never merely because the card is sitting free. So stopping it by hand sticks
# until the card next changes hands.
gpu_manager_default_tenant: {}

# The RTX A5000's real vGPU types. nvidia-666 is RTXA5000-24Q: the whole
# 24 GB card, so exactly one tenant at a time.
gpu_manager_profiles:
  Q-8C: {vram_mb: 8192, max_instances: 3, mdev_type: nvidia-664}
  Q-12C: {vram_mb: 12288, max_instances: 2, mdev_type: nvidia-665}
  Q-24C: {vram_mb: 24576, max_instances: 1, mdev_type: nvidia-666}

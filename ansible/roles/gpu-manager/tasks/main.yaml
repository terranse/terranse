---
# GPU Manager Role
#
# Installs GPU allocation scripts on Proxmox host for managing
# vGPU and SR-IOV resources with priority-based allocation.
#
# This role should be run on the Proxmox HOST, not inside VMs.

- name: Create GPU manager directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /usr/local/bin
    - /var/lib/gpu-manager
    - /etc/gpu-manager

- name: Copy GPU allocation script
  ansible.builtin.copy:
    src: gpu-allocate.sh
    dest: /usr/local/bin/gpu-allocate.sh
    mode: '0755'

- name: Copy GPU status script
  ansible.builtin.copy:
    src: gpu-status.sh
    dest: /usr/local/bin/gpu-status.sh
    mode: '0755'

- name: Copy GPU preempt script
  ansible.builtin.copy:
    src: gpu-preempt.sh
    dest: /usr/local/bin/gpu-preempt.sh
    mode: '0755'

- name: Copy VM snapshot script
  ansible.builtin.copy:
    src: vm-snapshot.sh
    dest: /usr/local/bin/vm-snapshot.sh
    mode: '0755'

- name: Copy GPU reconfiguration script
  ansible.builtin.copy:
    src: gpu-reconfig.sh
    dest: /usr/local/bin/gpu-reconfig.sh
    mode: '0755'

- name: Deploy GPU profiles configuration
  ansible.builtin.template:
    src: gpu-profiles.conf.j2
    dest: /etc/gpu-manager/gpu-profiles.conf
    mode: '0644'

- name: Deploy game profiles database
  ansible.builtin.template:
    src: game-profiles.json.j2
    dest: /etc/gpu-manager/game-profiles.json
    mode: '0644'

- name: Initialize allocation state file
  ansible.builtin.copy:
    content: |
      {
        "allocations": {},
        "last_updated": "{{ ansible_date_time.iso8601 }}"
      }
    dest: /var/lib/gpu-manager/allocations.json
    mode: '0644'
    force: false

# =============================================================================
# Session Watcher - VM lifecycle management based on Sunshine sessions
# =============================================================================
- name: Install inotify-tools for session watching
  ansible.builtin.apt:
    name: inotify-tools
    state: present

- name: Copy session watcher script
  ansible.builtin.copy:
    src: session-watcher.sh
    dest: /usr/local/bin/session-watcher.sh
    mode: '0755'

- name: Deploy VM hostname to VMID mapping
  ansible.builtin.template:
    src: vm-map.json.j2
    dest: /etc/gpu-manager/vm-map.json
    mode: '0644'
  when: gaming_vms is defined

- name: Deploy session watcher service
  ansible.builtin.template:
    src: session-watcher.service.j2
    dest: /etc/systemd/system/session-watcher.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart session watcher

- name: Mount session state directory from NAS
  ansible.posix.mount:
    path: /mnt/gaming/session-state
    src: "{{ nfs_server }}:/tank/gaming/session-state"
    fstype: nfs
    opts: "rw,noatime,nfsvers=4.2"
    state: mounted
  when: nfs_server is defined

- name: Enable session watcher service
  ansible.builtin.systemd:
    name: session-watcher
    enabled: true
    state: started
    daemon_reload: true
  when: enable_session_watcher | default(true)

# =============================================================================
# Optional: Simple HTTP API for external integrations
# =============================================================================
- name: Create simple HTTP API service (optional)
  ansible.builtin.template:
    src: gpu-manager-api.service.j2
    dest: /etc/systemd/system/gpu-manager-api.service
    mode: '0644'
  notify: Reload systemd
  when: enable_gpu_api | default(false)

# =============================================================================
# Monitoring and Health Checks
# =============================================================================
- name: Include monitoring tasks
  ansible.builtin.include_tasks: monitoring.yaml
  when: enable_monitoring | default(true)

# =============================================================================
# Publish and attach each VM's declared mounts over virtiofs
# =============================================================================
# gaming_vms is keyed by hostname: { gaming: { vmid: 111, mounts: [...] } }.
#
# A container can bind-mount the host's filesystem; a VM cannot. So every mount a
# VM declares becomes a Proxmox directory mapping (id = mount name = virtiofs
# tag), attached here and mounted inside the guest by the guest play. This is the
# VM counterpart of the LXC `mounts` list and takes the same {name,dataset,path}.
#
# The vGPU guest-driver share is attached alongside them: it is not user storage,
# it is how the guest gets its driver, and without it every driver-install task in
# the gaming role silently *skips* — a VM with no NVIDIA driver and no error.
#
# Attaching a dirid that does not exist makes the VM refuse to START ("Directory
# ID gaming-pc-games does not exist"), and `qm set` accepts it without complaint,
# so the damage only surfaces at the next boot. Publish first, then attach only
# what exists.
- name: Read the directory mappings that already exist
  ansible.builtin.command: pvesh get /cluster/mapping/dir --output-format json
  register: gpu_dir_mappings_pre
  changed_when: false
  failed_when: false

- name: Resolve the host mountpoint of each declared dataset
  ansible.builtin.command: "zfs list -Ho mountpoint {{ item.1.dataset }}"
  register: _vm_mount_points
  loop: "{{ gaming_vms | dict2items | subelements('value.mounts', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.name }} ({{ item.1.dataset }})"
  changed_when: false
  failed_when: false

# Wine needs extended attributes, and it needs them all the way down.
#
# Steam puts a game's Proton prefix inside the library the game lives in, so prefixes
# land on these shares. Wine stores Windows file attributes in xattrs; without them
# wineserver reports "file_set_error() can't map error: Operation not supported",
# msiexec cannot even create its own log (0 bytes), and every MSI-based installer dies
# and rolls back. For EA titles that surfaces as the EA App failing at 99% with
# INST-14-1603 — which looks like an EA bug, is reported all over ProtonDB as a Proton
# bug, and is actually a missing virtiofsd flag. Ubisoft Connect and the Rockstar
# launcher would break identically.
#
# ZFS must store the xattrs (`xattr=sa`) before virtiofsd can expose them: the pool
# ships with acltype=off, and on that dataset `expose-acl=1` makes virtiofsd reject
# EVERY operation — ls, touch and rm all fail with "Operation not supported" and the
# guest's mount is unusable. Set the dataset properties first; keep expose-acl OFF
# (Wine wants xattrs, not POSIX ACLs).
- name: Let ZFS store extended attributes on the shared datasets
  community.general.zfs:
    name: "{{ item.1.dataset }}"
    state: present
    extra_zfs_properties:
      xattr: sa
      acltype: posixacl
  loop: "{{ gaming_vms | dict2items | subelements('value.mounts', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.dataset }}"
  failed_when: false

- name: Publish a directory mapping for each mount
  # --map is a property list; "host=path" is rejected with
  # "map[0].path: property is missing".
  ansible.builtin.command: >-
    pvesh create /cluster/mapping/dir
    --id {{ item.item.1.name }}
    --map node={{ ansible_hostname }},path={{ item.stdout | trim }}
    --description "{{ item.item.1.dataset }} (shared to {{ item.item.0.key }} via virtiofs)"
  loop: "{{ _vm_mount_points.results | default([]) }}"
  loop_control:
    label: "{{ item.item.1.name }} -> {{ item.stdout | default('') | trim }}"
  when:
    - item.rc | default(1) == 0
    - item.stdout | default('') | trim is match('^/')
    - item.item.1.name not in (gpu_dir_mappings_pre.stdout | default('') )
  failed_when: false

- name: Read the directory mappings the host publishes
  ansible.builtin.command: pvesh get /cluster/mapping/dir --output-format json
  register: gpu_dir_mappings
  changed_when: false
  failed_when: false

- name: Select the shares to attach to each VM
  ansible.builtin.set_fact:
    _published: "{{ gpu_dir_mappings.stdout | default('[]') | from_json | map(attribute='id') | list }}"

# expose-xattr=1: see "Let ZFS store extended attributes" above — without it Wine
# prefixes on these shares cannot run MSI installers at all. Never add expose-acl=1;
# it takes the whole mount down unless the host dataset has POSIX ACLs, and Wine does
# not want it regardless.
- name: Attach virtiofs shares to gaming VMs
  ansible.builtin.command: >-
    qm set {{ item.value.vmid }}
    {% for share in ((item.value.mounts | default([]) | map(attribute='name') | list)
                     + [vgpu_virtiofs_mapping | default('nvidia-guest-drivers')])
                    | select('in', _published) | list %}
    --virtiofs{{ loop.index0 }} dirid={{ share }},expose-xattr=1
    {% endfor %}
  loop: "{{ gaming_vms | dict2items }}"
  loop_control:
    label: "{{ item.key }} (vmid {{ item.value.vmid }})"
  when:
    - gaming_vms is defined and gaming_vms | length > 0
    - ((item.value.mounts | default([]) | map(attribute='name') | list)
       + [vgpu_virtiofs_mapping | default('nvidia-guest-drivers')])
      | select('in', _published) | list | length > 0

- name: Warn about declared mounts the host could not publish
  ansible.builtin.debug:
    msg: >-
      {{ item.key }}: mapping(s)
      {{ item.value.mounts | default([]) | map(attribute='name') | difference(_published) | join(', ') }}
      could not be published (missing dataset?), so they are not attached and will
      be absent inside the VM.
  loop: "{{ gaming_vms | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.value.mounts | default([]) | map(attribute='name') | difference(_published) | length > 0

- name: Display GPU Manager setup info
  ansible.builtin.debug:
    msg: |
      ========================================
      GPU Manager Setup Complete!

      Scripts installed:
        gpu-allocate.sh request <vm_id> [profile]
        gpu-allocate.sh release <vm_id>
        gpu-status.sh
        gpu-preempt.sh <vm_id>
        vm-snapshot.sh <vm_id> <action>
        health-check.sh [component...]

      Configuration:
        /etc/gpu-manager/gpu-profiles.conf
        /etc/gpu-manager/game-profiles.json

      State:
        /var/lib/gpu-manager/allocations.json

      Monitoring:
        Session monitor: {{ 'enabled' if (enable_session_monitor | default(true)) else 'disabled' }}
        Health checks: Run with 'health-check.sh all'
      ========================================

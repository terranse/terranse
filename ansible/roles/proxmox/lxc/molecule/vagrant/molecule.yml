---
dependency:
  name: galaxy

driver:
  name: vagrant
  provider:
    name: libvirt
    options:
      memory: 1024
      cpus: 1

platforms:
  - name: proxmox-lxc-test-debian
    box: debian/bookworm64
    instance_raw_config_args:
      - "vm.synced_folder '.', '/vagrant', disabled: true"

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      proxmox-lxc-test-debian:
        # Skip Proxmox-specific delegation tasks
        skip_proxmox_delegation: true
        # Disable hash checking for testing
        enable_setup_hash_check: false
        # Mock services variable (empty - no docker)
        services: '[]'

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

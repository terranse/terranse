---
dependency:
  name: galaxy

driver:
  name: vagrant
  provider:
    name: libvirt
    options:
      memory: 1024
      cpus: 1

platforms:
  - name: borgmatic-test-debian
    box: debian/bookworm64
    instance_raw_config_args:
      - "vm.synced_folder '.', '/vagrant', disabled: true"

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      borgmatic-test-debian:
        # Enable test mode to skip 1password integration
        borgmatic_test_mode: true

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
